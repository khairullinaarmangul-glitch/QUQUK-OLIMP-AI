<body><a class="skip" href="#main">Мазмұнға өту</a><div id="app"><main class="loading"><div class="seal">⚖</div><h1>QŪQYQ OLYMP AI</h1><p>Оқу кеңістігі ашылуда…</p></main></div><div id="notice" role="status" aria-live="polite"></div><dialog id="editor"></dialog><script>function createStudentStore({seed,storage,key='quqyq-premium-student-v1'}){
 let db={personal:{},attempts:[]},loadError='';
 try{const raw=storage?.getItem(key);if(raw){const x=JSON.parse(raw);if(!x||!x.personal||!Array.isArray(x.attempts))throw new Error();db=x}}catch{loadError='Сақталған деректер ашылмады. Браузердегі деректерді өшірмей, мұғалімге хабарласыңыз.'}
 const clone=x=>structuredClone(x),bad=m=>{throw new Error(m)};
 const clean=q=>{const {answer,explanation,...rest}=q;return rest};
 function summary(x){const a=x.answers,score=a.filter(v=>v.correct).length;return {total:x.questions.length,answered:a.length,score,pct:a.length?Math.round(100*score/a.length):0,complete:a.length===x.questions.length,answers:clone(a),wrong:a.filter(v=>!v.correct).map(v=>v.id)}}
 function save(next){try{if(!storage)throw new Error();storage.setItem(key,JSON.stringify(next))}catch{bad('Браузер деректі сақтай алмады. Жеке режимді өшіріңіз немесе нәтижелерді экспорттап, браузердегі орын көлемін тексеріңіз.')}db=next}
 const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID();
 function attempt(id){const a=db.attempts.find(v=>v.id===id);if(!a)bad('Жаттығу табылмады.');return a}
 function collections(list){if(!Array.isArray(list)||list.length>100)bad('Жинақтар пішімі жарамсыз.');const valid=new Set(seed.map(x=>x.id));return list.map(x=>{if(!x||typeof x.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(x.id)||typeof x.name!=='string'||!x.name.trim()||!Array.isArray(x.ids))bad('Жинақ атауын тексеріңіз.');return {id:x.id,name:x.name.trim().slice(0,200),ids:[...new Set(x.ids.filter(v=>valid.has(v)))].slice(0,1000)}})}
 return {async api(path,b){if(loadError)bad(loadError);const next=clone(db);
  if(path==='state')return {me:{id:'this-device',name:'Оқушы',role:'student'},items:seed.filter(x=>x.status!=='archived').map(x=>x.kind==='question'?clean(x):clone(x)),personal:clone(db.personal),attempts:[...db.attempts].reverse().map(x=>({id:x.id,date:x.date,...summary(x)}))};
  if(path==='start'){
   let qs=seed.filter(x=>x.kind==='question'&&x.status==='verified');if(b?.ids)qs=qs.filter(x=>b.ids.includes(x.id));if(b?.category)qs=qs.filter(x=>x.category===b.category);if(b?.grade)qs=qs.filter(x=>x.grade===Number(b.grade));if(!qs.length)bad('Осы таңдауда тексерілген сұрақ жоқ. Басқа сыныпты не санатты таңдаңыз.');
   for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
   const a={id:uid(),date:now(),questions:clone(qs.slice(0,Math.min(50,Math.max(1,Number(b?.limit)||10)))),answers:[]};next.attempts.push(a);save(next);return {id:a.id,questions:a.questions.map(clean),answers:[]};
  }

olid #c9d4e3!important;opacity:1!important}#gradeTests .choice.correct{background:#dcfce7!important;color:#14532d!important;border-color:#16a34a!important}#gradeTests .choice.wrong{background:#fee2e2!important;color:#7f1d1d!important;border-color:#dc2626!important}#gradeTests .feedback{background:#e8f2ff!important;color:#17365d!important}</style><style id=\"grade-contrast\">#gradeTests .choice,#gradeTests .choice:disabled{background:#f5f7fc!important;color:#14253e!important;border:2px solid #c9d4e3!important;opacity:1!important}#gradeTests .choice.correct{background:#dcfce7!important;color:#14532d!important;border-color:#16a34a!important}#gradeTests .choice.wrong{background:#fee2e2!important;color:#7f1d1d!important;border-color:#dc2626!important}#gradeTests .feedback{background:#e8f2ff!important;color:#17365d!important}#gradeTests select{margin:8px 0 18px}</style><style id=\"variant-grid-style\">.variant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px;margin:14px 0 18px}.variant-grid button{background:#173653!important;color:#f5f8ff!important;border:1px solid #bb995e!important;padding:11px 5px!important;font-size:14px!important;min-height:44px}.variant-grid button.active{background:#f1c46d!important;color:#10233e!important;border:2px solid #ffdc93!important}#gradeTests .tile button.primary{color:#10233e!important}#gradeTests .choice{color:#14253e!important;opacity:1!important}#gradeTests .feedback{color:#17365d!important}@media(max-width:500px){.variant-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.variant-grid button{font-size:12px!important}}</style></head>\n<body>\n<header><div class=\"brand\">⚖ QŪQYQ OLYMP AI</div><h1 class=\"hero\">Құқық олимпиадасына<br/>ақылды дайындық</h1><p class=\"lead\">Қазақстан құқығын меңгеріңіз: тест тапсырыңыз, құқықтық жағдайларды талдаңыз және нәтижені бірден көріңіз. 9–11-сыныптарға арналған оқу тренажері.</p><nav aria-label=\"Бөлімдер\"><button class=\"active\" data-tab=\"home\">Басты бет</button><button data-tab=\"quiz\">Тест орталығы</button><button data-tab=\"gradeTests\">9–11 сынып тесттері</button><button data-tab=\"cases\">Құқықтық кейстер</button><button data-tab=\"library\">Заңнама</button><button data-tab=\"books\">📚 Оқулықтар мен тапсырмалар</button><button data-tab=\"results\">Нәтижелер</button><button data-tab=\"olympiad\">🏆 Олимпиада</button><button data-tab=\"curriculum\">🗂️ Оқу картасы</button><button data-tab=\"practicecases\">⚖️ 22 кейс</button></nav><p class=\"muted\" style=\"font-size:.87rem;margin-top:14px\">Сынақ нұсқасы · Оқулық мәтіндері мен құқықтық нормалар ресми дереккөздермен толық салыстырылғаннан кейін түпкілікті жарияланады.</p></header>\n<main><section class=\"panel\" id=\"studentNotice\" style=\"border:2px solid #dcb66a!important\"><span class=\"pill\">ОҚУШЫЛАРҒА АРНАЛҒАН НҰСҚА</span><h2>Тест нәтижесін қалай сақтайсыз?</h2><p>Тестті аяқтаған соң <strong>«Нәтижелер»</strong> бөліміне кіріңіз. Нәтижелер осы телефонның немесе компьютердің браузерінде сақталады. Мұғалім нәтижелерді автоматты түрде көрмейді.</p><p>Нәтижені жоғалтпау үшін «Нәтижелер» бөліміндегі CSV экспорттау батырмасы бар болса, файлды сақтап, мұғалімге жіберіңіз. Жеке деректеріңізді сайтқа жазбаңыз.</p><p class=\"muted\">Бұл — оқу-жаттығу нұсқасы. Кейбір оқулық параграфтары мен құқықтық түсіндірмелер әлі нақтылануда. 1–40 нұсқаларда бір сұрақ банкі әртүрлі ретпен ұсынылуы мүмкін.</p></section>\n<section class=\"page\" id=\"home\"><div class=\"panel\"><span class=\"pill\">Бастауға дайын</span><h2>Олимпиадаға дайындықты бастаңыз</h2><p class=\"muted\"><strong>Жаңарту ескертпесі:</strong> Конституциялық сұрақтардың бап нөмірлері ресми мәтінмен толық салыстырылғанға дейін көрсетілмейді. Заңнама бөліміндегі ресми сілтемені пайдаланыңыз.</p><p class=\"muted\">Тақырыпты таңдап, тестке өтіңіз. Сұрақтардың түсіндірмелері қателеріңізді талдауға көмектеседі.</p><div class=\"grid\"><div class=\"tile\"><b>12</b><p>Негізгі тест сұрағы</p></div><div class=\"tile\"><b>3</b><p>Құқықтық кейс</p></div><div class=\"tile\"><b>4</b><p>Тест тақырыбы</p></div></div><p><button class=\"primary\" onclick=\"go('quiz')\">Тестті бастау →</button></p></div><div class=\"panel\"><h3>Бұл нұсқада не бар?</h3><p class=\"muted\">Тестке жауап беру, дұрыс жауаптың түсіндірмесін көру, ұпай есептеу, кейстерді талдау, нәтижені осы құрылғыда сақтау. Оқушы тіркелуі мен мұғалімге ортақ статистика әзірге қосылмаған.</p></div></section>\n<section class=\"page hide\" id=\"quiz\"><div class=\"panel\"><h2>Тест орталығы</h2><label for=\"topic\">Тақырыпты таңдаңыз: </label><select id=\"topic\"><option value=\"all\">Барлық тақырып (12 сұрақ)</option><option value=\"constitution\">Конституциялық құқық</option><option value=\"criminal\">Қылмыстық құқық</option><option value=\"civil\">Азаматтық және отбасы құқығы</option><option value=\"labor\">Еңбек және әкімшілік құқық</option></select><button class=\"primary\" id=\"startBtn\">Жаңа тест</button><div aria-live=\"polite\" id=\"quizArea\"><p class=\"muted\">Тестті бастау үшін «Жаңа тест» батырмасын басыңыз.</p></div></div></section>\n<section class=\"page hide\" id=\"cases\"><div class=\"panel\"><h2>Құқықтық кейстер зертханасы</h2><p class=\"muted\">Жауабыңызды жазып, үлгі талдаумен салыстырыңыз. Бұл бөлім автоматты баға қоймайды.</p><div id=\"casesArea\"></div></div></section>\n<section class=\"page hide\" id=\"library\"><div class=\"panel\"><h2>Заңнама кітапханасы</h2><p class=\"pill\">Конституция: 01.07.2026 бастап қолданыстағы редакция</p><p class=\"muted\">Нормативтік актілердің қолданыстағы редакциясын ресми дереккөзден тексеріңіз. Заңнама өзгеруі мүмкін.</p><div class=\"grid\"><div class=\"tile\"><h3>ҚР Конституциясы (2026)</h3><p class=\"muted\">2026 жылғы 15 наурызда қабылданған, 2026 жылғы 1 шілдеден қолданыстағы Конституция. Ресми мәтінін Әділет жүйесінен қараңыз.</p><p><a href=\"https://adilet.zan.kz/kaz/docs/K2600000000\" rel=\"noopener noreferrer\" target=\"_blank\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Қылмыстық кодекс</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K1400000226\" rel=\"noopener noreferrer\" target=\"_blank\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Еңбек кодексі</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K1500000414\" rel=\"noopener noreferrer\" target=\"_blank\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Азаматтық кодекс (жалпы бөлім)</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K940001000_\" rel=\"noopener noreferrer\" target=\"_blank\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Неке (ерлі-зайыптылық) және отбасы туралы кодекс</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K1100000518\" rel=\"noopener noreferrer\" target=\"_blank\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Құқықтық ақпарат</h3><p><a href=\"https://adilet.zan.kz/kaz\" rel=\"noopener noreferrer\" target=\"_blank\">Құжаттарды іздеу ↗</a></p></div></div></div></section>\n<section class=\"page hide\" id=\"books\"><div class=\"panel\"><span class=\"pill\">ЖАҢА БӨЛІМ · 9–11-СЫНЫП</span><h2>📚 Оқы → Ойлан → Орында</h2><p class=\"muted\">Бес оқулықтың тақырыптары бойынша дайындал. Оқулықтардың толық PDF файлдары бұл сайтқа көшірілмеген. Кітаптарды өзіңіздегі нұсқадан оқыңыз немесе құқық иесі рұқсат берген электрондық нұсқасын іздеңіз.</p><div class=\"grid\" id=\"bookCards\"></div></div><div class=\"panel\"><h2>Тақырыптық жаттығу</h2><p class=\"muted\">Тақырыпты таңдаңыз. Бұл — оқулық ұғымдарына арналған авторлық жаттығулар; нақты заң баптары үшін «Заңнама» бөліміндегі ресми мәтінді қараңыз.</p><label for=\"bookTopic\">Тақырып:</label> <select id=\"bookTopic\"></select><button class=\"primary\" id=\"bookStart\">Тапсырманы бастау</button><div aria-live=\"polite\" id=\"bookQuiz\"></div></div></section>\n<section class=\"page hide\" id=\"olympiad\"><div class=\"panel\"><span class=\"pill\">🏆 ОЛИМПИАДА РЕЖИМІ</span><h2>Білім сайысы · 9–11 сынып</h2><p class=\"muted\">Уақыт шектеуі бар жаттығу. Бұл ресми олимпиада емес. Қате жауаптар сынақ соңында талданады және нәтиже осы браузерде сақталады. Сұрақтар құқықтық ұғымдарды түсінуге бағытталған; нақты заң баптарын ресми дереккөзден тексеріңіз.</p><label for=\"olympLevel\">Күрделілік деңгейі:</label> <select id=\"olympLevel\"><option value=\"easy\">Жеңіл · 8 сұрақ · 10 минут</option><option value=\"medium\">Орташа · 12 сұрақ · 15 минут</option><option value=\"hard\">Күрделі · 16 сұрақ · 20 минут</option></select> <button class=\"primary\" id=\"olympStart\" type=\"button\">Олимпиаданы бастау</button><div class=\"olymp-grid\"><div class=\"olymp-stat\">Уақыт<strong id=\"olympTime\">—</strong></div><div class=\"olymp-stat\">Ұпай<strong id=\"olympScore\">0</strong></div><div class=\"olymp-stat\">Сұрақ<strong id=\"olympCount\">0 / 0</strong></div></div><div id=\"olympProgress\"><div id=\"olympBar\"></div></div><div id=\"olympQuestion\" style=\"margin-top:20px\"></div><div id=\"olympFeedback\"></div><button id=\"olympNext\" style=\"display:none\" type=\"button\">Келесі сұрақ →</button><div id=\"olympReview\" aria-live=\"polite\"></div><div class=\"case\" style=\"margin-top:20px\"><h3>Олимпиада нәтижелерінің тарихы</h3><p class=\"muted\">Нәтижелер осы браузерде сақталады. Басқа телефонда автоматты көрінбейді.</p><div id=\"olympHistory\"></div><button class=\"secondary\" type=\"button\" id=\"olympExport\">Нәтижелерді CSV жүктеу</button> <button class=\"secondary\" type=\"button\" id=\"olympClear\">Олимпиада тарихын тазалау</button></div></div></section>\n<section class=\"page hide\" id=\"curriculum\"><div class=\"panel\"><span class=\"pill\">9–11 СЫНЫП · ОҚУ БАҒДАРЫ</span><h2>Тақырыптар бойынша оқу картасы</h2><p class=\"muted\">Төмендегі тақырыптар — оқу бағытын көрсетуге арналған топтамалар; оқулықтағы параграф нөмірлері мен нақты атаулары әлі толық сәйкестендірілмеген.</p><p class=\"muted\"><strong>40 жаттығу реті:</strong> әр сыныпта 1–40 ретін таңдауға болады. Қазіргі 50 сұрақ әр ретте араластырылып беріледі; бұлар 40 бірегей сұрақ жиынтығы емес. Жаңа сұрақтар тексерілген сайын банк кеңейеді.</p><p class=\"muted\">Жаттығу нұсқасын «9–11 сынып тесттері» бөлімінен таңдаңыз.</p><div class=\"grid\"><div class=\"tile\"><h3>9-сынып</h3><details><summary>Мемлекет және құқық</summary><p class=\"muted\">Құқық нормасы, құқықтық қатынас, құқық бұзушылық</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Конституциялық құқық</summary><p class=\"muted\">Мемлекеттік билік, азаматтардың құқықтары</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Азаматтық құқық</summary><p class=\"muted\">Меншік, мәміле, тұтынушы</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Еңбек құқығы</summary><p class=\"muted\">Еңбек шарты, жұмыс уақыты</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Отбасы құқығы</summary><p class=\"muted\">Неке, ата-ана мен баланың құқықтары</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Қылмыстық және әкімшілік құқық</summary><p class=\"muted\">Жауапкершілік және құқық бұзушылық</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>10-сынып · I бөлім</h3><details><summary>Мемлекет пен құқықтың пайда болуы</summary><p class=\"muted\">Мемлекет белгілері, құқық ұғымы</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Құқықтың қайнар көздері</summary><p class=\"muted\">Нормативтік құқықтық актілер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Құқықтық қатынастар</summary><p class=\"muted\">Субъект, объект, мазмұн</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Конституциялық құрылыс</summary><p class=\"muted\">Мемлекет және азамат</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>10-сынып · II бөлім</h3><details><summary>Азаматтық құқық</summary><p class=\"muted\">Мәмілелер және меншік</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Міндеттемелік құқық</summary><p class=\"muted\">Шарттар және міндеттемелер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Отбасы және еңбек құқығы</summary><p class=\"muted\">Құқықтар мен міндеттер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Іс жүргізу негіздері</summary><p class=\"muted\">Дәлелдеме және рәсім</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>11-сынып · I бөлім</h3><details><summary>Құқықтық мемлекет</summary><p class=\"muted\">Заң үстемдігі және билік</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Адам құқықтары</summary><p class=\"muted\">Құқықтарды қорғау</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Әкімшілік құқық</summary><p class=\"muted\">Әкімшілік құқықтық қатынастар</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Қылмыстық құқық</summary><p class=\"muted\">Қылмыс құрамы және жауаптылық</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>11-сынып · II бөлім</h3><details><summary>Азаматтық-құқықтық шарттар</summary><p class=\"muted\">Шарттың тараптары мен шарттары</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Мұрагерлік құқық</summary><p class=\"muted\">Мұрагерлер және мұра</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Тұтынушылар құқығы</summary><p class=\"muted\">Сапа және шағым</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Құқықтық даулар</summary><p class=\"muted\">Талап және дәлелдемелер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div></div><p><button class=\"primary\" onclick=\"go('books')\">Оқулық тапсырмалары →</button></p></div></section><section class=\"page hide\" id=\"practicecases\"><div class=\"panel\"><span class=\"pill\">22 ҚОСЫМША ЖАҒДАЯТ</span><h2>Құқықтық жағдайды талдау</h2><p class=\"muted\">Модельдік оқу жағдаяттары. Нақты істерде қолданыстағы заң мәтінін тексеріңіз.</p><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 1</span><h3>Сатып алынған құлаққап екі күннен кейін жұмыс істемей қалды.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Сатып алу деректерін сақтап, сатушыға жазбаша талап қою; тауардың кемшілігін және тұтынушының заңдағы талаптарын анықтау.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 2</span><h3>Оқушының суретін сыныптасы рұқсатсыз жариялады.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Жарияланымның мән-жайын, жеке өмір және бейне құқықтарын тексеру; өшіруді сұрау және қажет болса заңды өкілге жүгіну.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 3</span><h3>Оқушы жұмысқа орналасқысы келеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Жасын, жұмыс түрін, оқу уақытына әсерін, заңды өкіл келісімі қажет болуын және еңбек шартын тексеру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 4</span><h3>Көрші қатты шу шығарып, тұрғындарға кедергі жасады.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Оқиға уақытын, дәлелдерін, жергілікті тәртіп нормаларын анықтап, уәкілетті органға заңды тәртіппен жүгіну.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 5</span><h3>Оқушы досының затын рұқсатсыз алды.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Меншік иесінің құқықтарын, ниетін, келтірілген залалды және жасына байланысты жауаптылық шарттарын ажырату.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 6</span><h3>Дүкен баға белгісінде бір сома, кассада басқа сома көрсетті.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Баға туралы ақпарат пен төлем дәлелін салыстырып, тұтынушының ақпарат алу құқығын және талап қою тәртібін тексеру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 7</span><h3>Интернет-дүкен тауарды жеткізбеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Тапсырыс пен төлем дәлелін сақтап, шарттың талаптарын тексеру, сатушыға талап жіберу.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 8</span><h3>Азамат велосипедін досына уақытша берді, бірақ қайтармады.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Берудің құқықтық негізін, тараптардың келісімін, затқа меншік құқығын және қайтару талабын анықтау.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 9</span><h3>Жұмыс беруші қызметкерге шарт көшірмесін бермеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Еңбек шартының рәсімделуін, қызметкердің құқықтарын және еңбек инспекциясына жүгіну мүмкіндігін қарастыру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 10</span><h3>Сатып алушы заттың жасырын ақауын тапты.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Кемшілік туралы дәлелдерді жинап, сатушының міндеттерін және заңды қорғау тәсілдерін талдау.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">11-сынып · Жағдаят 11</span><h3>Екі адам келісімшарттың маңызды талабын әртүрлі түсінеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Шарт мәтінін, хат алмасуды, тараптардың еркін және дауды реттеу жолдарын талдау.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">11-сынып · Жағдаят 12</span><h3>Мұра қалдырушы қайтыс болды, бірнеше мұрагер бар.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Мұраның ашылуы, өсиет бар-жоғы, мұрагерлер шеңбері мен мерзімдерді қолданыстағы кодекспен тексеру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">11-сынып · Жағдаят 13</span><h3>Тұтынушыға қызмет толық көрсетілмеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Шартты, төлемді, қызмет көлемін, кемшіліктерді және тұтынушы талаптарын салыстыру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны жоғары заңдық күші бар. Бап нөмірін заңнаманың ресми мәтінімен салыстырып тексеріңіз.'},\n{t:'criminal',q:'Қылмыстық жауаптылықтың жалпы басталу жасы қандай?',o:['14 жас','15 жас','16 жас','18 жас'],a:2,e:'ҚР Қылмыстық кодексінің 15-бабы: жалпы ереже бойынша 16 жас, ал заңда көрсетілген кейбір қылмыстар үшін 14 жас.'},\n{t:'criminal',q:'Адамның кінәлі екендігін кімнің заңды күшіне енген үкімі анықтайды?',o:['Полицияның','Соттың','Прокурордың','Әкімдіктің'],a:1,e:'Кінәсіздік презумпциясы: адамның кінәсі заңда белгіленген тәртіппен дәлелденіп, заңды күшіне енген сот үкімімен анықталғанға дейін ол кінәсіз деп есептеледі. 2026 жылғы Конституциядағы нақты бап нөмірін ресми мәтіннен тексеріңіз.'},\n{t:'criminal',q:'Қылмыстық құқықтағы кінәсіздік презумпциясы нені білдіреді?',o:['Айыпталушы міндетті түрде кінәлі','Кінә дәлелденгенге дейін адам кінәсіз саналады','Кез келген куәлік жеткілікті','Сот қажет емес'],a:1,e:'Кінәлілік заңда белгіленген тәртіппен дәлелденіп, заңды күшіне енген сот үкімімен анықталуы керек.'},\n{t:'civil',q:'Азаматтық құқық қабілеттілігі қашан пайда болады?',o:['16 жаста','18 жаста','Туған кезде','Мектепке барған кезде'],a:2,e:'ҚР Азаматтық кодексінің 13-бабы: азаматтық құқық қабілеттілігі туған кезден басталып, қайтыс болғанда тоқтатылады.'},\n{t:'civil',q:'Азаматтық әрекет қабілеттілігі толық көлемде, жалпы ереже бойынша, нешеде пайда болады?',o:['14 жаста','16 жаста','18 жаста','21 жаста'],a:2,e:'ҚР Азаматтық кодексінің 17-бабы: толық әрекет қабілеттілігі жалпы ереже бойынша 18 жасқа толғанда пайда болады; заңда ерекшеліктер бар.'},\n{t:'civil',q:'Ата-ана мен баланың құқықтары және міндеттері негізінен қай құқық саласында қаралады?',o:['Отбасы құқығы','Қылмыстық құқық','Салық құқығы','Халықаралық жария құқық'],a:0,e:'Ата-аналар мен балалар арасындағы отбасылық қатынастар неке (ерлі-зайыптылық) және отбасы туралы заңнамамен реттеледі.'},\n{t:'labor',q:'Еңбек қатынастарының туындауына әдетте не негіз болады?',o:['Ауызша уәде ғана','Еңбек шарты','Әлеуметтік желідегі хабарлама','Тек өтініш'],a:1,e:'ҚР Еңбек кодексіне сәйкес еңбек қатынастары, жалпы ереже бойынша, еңбек шартының негізінде туындайды.'},\n{t:'labor',q:'ҚР Еңбек кодексі бойынша еңбек шартын жасасуға жалпы жол берілетін жас?',o:['12 жас','14 жас','16 жас','21 жас'],a:2,e:'ҚР Еңбек кодексінің 31-бабы: жалпы ереже бойынша 16 жасқа толған азаматтармен еңбек шартын жасасуға жол беріледі; төменгі жасқа қатысты ерекше жағдайлар бар.'},\n{t:'labor',q:'Әкімшілік құқық бұзушылық дегеніміз не?',o:['Тек қылмыс','Әкімшілік жауаптылық көзделген құқыққа қарсы кінәлі әрекет не әрекетсіздік','Кез келген әдепсіз сөз','Кез келген азаматтық шарт'],a:1,e:'Әкімшілік құқық бұзушылық туралы кодекстің 25-бабындағы жалпы анықтамаға сай әкімшілік жауаптылық көзделген құқыққа қарсы кінәлі іс-әрекет немесе әрекетсіздік.'}\n];\nconst cases=[\n{q:'15 жастағы оқушы демалыста дүкенге жұмысқа орналасқысы келеді. Еңбек шартына қандай талаптар қойылады?',a:'Жалпы жас шегі — 16 жас, бірақ Еңбек кодексінің 31-бабында 15 және 14 жастағыларға қатысты ерекше шарттар көзделген. Оқу процесіне кедергі келтірмеу, заңды өкілдің қатысуы және жұмыс түріне қойылатын шектеулерді талдау қажет.'},\n{q:'Адам әлеуметтік желіде біреуді қылмыс жасады деп айыптады. Сот үкімі жоқ. Қандай қағидат маңызды?',a:'Кінәсіздік презумпциясы маңызды: адам кінәсі заңда белгіленген тәртіппен дәлелденіп, соттың заңды күшіне енген үкімімен анықталғанға дейін кінәсіз деп есептеледі. Сонымен бірге ар-намыс пен қадір-қасиетті қорғау мәселесі туындауы мүмкін.'},\n{q:'17 жастағы азамат қымбат мүлікті өз бетінше сатып алғысы келеді. Нені тексеру керек?',a:'Оның әрекет қабілеттілігінің көлемін, мәміленің түрін және заңды өкілінің келісімі қажет пе екенін тексеру керек. Жалпы толық әрекет қабілеттілігі 18 жастан басталады, бірақ заңда ерекшеліктер бар.'}\n];\nconst pages=[...document.querySelectorAll('.page')];function go(id){pages.forEach(x=>x.classList.toggle('hide',x.id!==id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='results'){showHistory();if(typeof showGradeHistory==='function')showGradeHistory();}try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}}document.querySelectorAll('nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab))); \nlet pool=[],at=0,selected=null,score=0;const area=document.getElementById('quizArea');const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction start(){const topic=document.getElementById('topic').value;pool=questions.filter(q=>topic==='all'||q.t===topic);at=0;score=0;renderQuestion()}function renderQuestion(){selected=null;if(at>=pool.length){finish();return}const q=pool[at];area.innerHTML=`<p class=\"pill\">Сұрақ ${at+1} / ${pool.length}</p><div class=\"progress\"><div class=\"bar\" style=\"width:${at/pool.length*100}%\"></div></div><h3>${esc(q.q)}</h3><div id=\"options\"></div><div id=\"explanation\" aria-live=\"polite\"></div><div class=\"actions\"><span class=\"muted\">Әр дұрыс жауап — 1 ұпай</span><button class=\"primary\" id=\"next\" disabled>${at===pool.length-1?'Нәтижені көру':'Келесі сұрақ →'}</button></div>`;const options=document.getElementById('options');q.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>answer(i);options.appendChild(b)});document.getElementById('next').onclick=()=>{at++;renderQuestion()}}\nfunction answer(i){if(selected!==null)return;selected=i;const q=pool[at];if(i===q.a)score++;document.querySelectorAll('#options button').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('explanation').innerHTML=`<div class=\"feedback\"><b>${i===q.a?'✓ Дұрыс!':'Дұрыс жауап: '+String.fromCharCode(65+q.a)+'. '+esc(q.o[q.a])}</b><p>${esc(q.e)}</p></div>`;document.getElementById('next').disabled=false}\nfunction finish(){const pct=Math.round(score/pool.length*100);const record={date:new Date().toLocaleString('kk-KZ'),score,total:pool.length,pct,topic:document.getElementById('topic').selectedOptions[0].textContent};try{const h=JSON.parse(localStorage.getItem('quqyq-history')||'[]');h.unshift(record);localStorage.setItem('quqyq-history',JSON.stringify(h.slice(0,30)))}catch(e){}area.innerHTML=`<h3>Тест аяқталды!</h3><p style=\"font-size:30px;font-weight:800;color:#146c96\">${score} / ${pool.length} (${pct}%)</p><p class=\"muted\">${pct>=80?'Өте жақсы нәтиже!':pct>=50?'Жақсы бастама. Түсіндірмелерді қайталаңыз.':'Тақырыптарды қайта оқып, тағы бір рет орындаңыз.'}</p><button class=\"primary\" onclick=\"start()\">Қайта тапсыру</button> <button class=\"secondary\" onclick=\"go('results')\">Нәтижелер</button>`}\ndocument.getElementById('startBtn').onclick=start;\nconst caseArea=document.getElementById('casesArea');cases.forEach((c,i)=>{const div=document.createElement('div');div.className='case';div.innerHTML=`<span class=\"pill\">Кейс ${i+1}</span><h3>${esc(c.q)}</h3><label for=\"case${i}\">Сіздің талдауыңыз:</label><textarea id=\"case${i}\" placeholder=\"Қандай заң нормасы қолданылады? Неліктен?\"></textarea><div class=\"actions\"><button class=\"secondary\">Үлгі талдауды көрсету</button></div><div class=\"feedback hide\">${esc(c.a)}</div>`;div.querySelector('button').onclick=()=>div.querySelector('.feedback').classList.toggle('hide');caseArea.appendChild(div)});\nfunction showHistory(){const el=document.getElementById('history');let h=[];try{h=JSON.parse(localStorage.getItem('quqyq-history')||'[]')}catch(e){}el.innerHTML=h.length?h.map(x=>`<div class=\"case\"><b>${esc(x.score)} / ${esc(x.total)} (${esc(x.pct)}%)</b><p class=\"muted\">${esc(x.topic)} · ${esc(x.date)}</p></div>`).join(''):'<p class=\"muted\">Әзірге нәтиже жоқ. Алғашқы тестті орындаңыз.</p>'}document.getElementById('clearBtn').onclick=()=>{if(confirm('Осы браузердегі барлық нәтиж 0:level==='medium'?15:20)*60000;$('olympScore').textContent='0';$('olympFeedback').textContent='';$('olympReview').innerHTML='';timer=setInterval(tick,500);show();tick()}\nfunction show(){if(finished)return;locked=false;$('olympNext').style.display='none';$('olympFeedback').textContent='';$('olympCount').textContent=(pos+1)+' / '+active.length;$('olympBar').style.width=(100*pos/active.length)+'%';let q=active[pos];$('olympQuestion').innerHTML='<h3>'+esc(q[0])+'</h3>'+q[1].map((o,i)=>'<button class=\"olymp-answer\" data-i=\"'+i+'\">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');$('olympQuestion').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}\nfunction answer(i){if(locked||finished)return;locked=true;let q=active[pos];attempt[pos]=i;if(i===q[2])points++;$('olympScore').textContent=points;$('olympQuestion').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('olympFeedback').textContent=(i===q[2]?'✓ Дұрыс. ':'✗ Қате. ')+q[3]+' Дереккөз тақырыбы: '+q[4];$('olympNext').style.display='inline-block';$('olympNext').textContent=pos===active.length-1?'Нәтижені көру':'Келесі сұрақ →'}\nfunction finish(expired){if(finished)return;finished=true;clearInterval(timer);timer=null;$('olympBar').style.width='100%';$('olympCount').textContent=active.length+' / '+active.length;const pct=Math.round(points/active.length*100);$('olympQuestion').innerHTML='<h3>🏆 Нәтиже: '+points+' / '+active.length+'</h3><p>Дұрыс жауап үлесі: '+pct+'%</p>';$('olympFeedback').textContent=expired?'Уақыт аяқталды. Жауап берілмеген сұрақтар төменде көрсетілді.':'Сынақ аяқталды. Қате жауаптарды төменнен талдаңыз.';$('olympNext').style.display='none';const mistakes=active.map((q,i)=>({q,i,chosen:attempt[i]})).filter(x=>x.chosen!==x.q[2]);$('olympReview').innerHTML='<h3>Қате және жауап берілмеген сұрақтар: '+mistakes.length+'</h3>'+(mistakes.length?mistakes.map(x=>'<details><summary>'+(x.i+1)+'-сұрақ: '+esc(x.q[0])+'</summary><p><b>Сіздің жауабыңыз:</b> '+(x.chosen===undefined?'Жауап берілмеген':esc(x.q[1][x.chosen]))+'</p><p><b>Дұрыс жауап:</b> '+esc(x.q[1][x.q[2]])+'</p><p><b>Түсіндірме:</b> '+esc(x.q[3])+'</p><p class=\"muted\">Дереккөз: '+esc(x.q[4])+'</p></details>').join(''):'<p>Барлық сұраққа дұрыс жауап бердіңіз.</p>');const record={date:new Date().toLocaleString('kk-KZ'),score:points,total:active.length,pct,level:$('olympLevel').selectedOptions[0].textContent,expired,wrong:mistakes.length};const ok=writeOlympHistory([record,...readOlympHistory()]);if(!ok)$('olympFeedback').textContent+=' Ескерту: браузер нәтижені сақтай алмады.';renderOlympHistory()}\n$('olympStart').onclick=start;$('olympNext').onclick=()=>{if(finished)return;if(pos===active.length-1)finish(false);else{pos++;show()}};\n$('olympExport').onclick=()=>{const h=readOlympHistory();if(!h.length){alert('Жүктейтін нәтиже жоқ.');return}const rows=[['Күні','Деңгейі','Ұпай','Барлығы','Пайыз','Қате саны','Уақыт аяқталды'],...h.map(x=>[x.date||'',x.level||'',x.score,x.total,x.pct??Math.round(x.score/x.total*100),x.wrong??'',x.expired?'Иә':'Жоқ'])];const csv='\\ufeff'+rows.map(r=>r.map(v=>'\"'+String(v).replace(/\"/g,'\"\"')+'\"').join(';')).join('\\r\\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='QUQYQ_olympiada_natizheleri.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};\n$('olympClear').onclick=()=>{if(confirm('Олимпиада нәтижелерінің тарихын өшіресіз бе?')){try{localStorage.removeItem(olympKey)}catch(e){}renderOlympHistory()}};\nrenderOlympHistory();\n})();\n<\/script><script>\nconst gradeQuestions=[{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Мемлекеттің негізгі белгілерінің бірі қандай?\",\"o\":[\"Аумақ және жария билік\",\"Тек ортақ хобби\",\"Тек туыстық байланыс\",\"Тек жеке меншік\"],\"a\":0,\"e\":\"Мемлекеттің аумағы, жария билігі және егемендігі б амаудың салдары шартқа және заңға тәуелді.\",\"source\":\"11-сынып: PDF оқулықпен нақты параграф сәйкестігі әлі тексерілмеген\"},{\"grade\":11,\"topic\":\"Азаматтық шарттар\",\"q\":\"Сатып алушы тауарды қабылдаудан негізсіз бас тартса, не маңызды?\",\"o\":[\"Тек жарнама\",\"Тек куәгердің киімі\",\"Тек ауа райы\",\"Шарт талаптары мен бас тартудың негізі\"],\"a\":3,\"e\":\"Тараптың әрекеті шарт талаптарымен бағаланады.\",\"source\":\"11-сынып: PDF оқулықпен нақты параграф сәйкестігі әлі тексерілмеген\"},{\"grade\":11,\"topic\":\"Азаматтық шарттар\",\"q\":\"Тауарды жеткізу мерзімі туралы дау туындаса, не қаралады?\",\"o\":[\"Келісілген мерзім мен орындалу деректері\",\"Тек тауар түсі\",\"Тек қызметкер аты\",\"Тек жарнама\"],\"a\":0,\"e\":\"Мерзім шарт міндеттемесінің орындалуын бағалауда маңызды.\",\"source\":\"11-сынып: PDF оқулықпен нақты параграф сәйкестігі әлі тексерілмеген\"},{\"grade\":11,\"topic\":\"Азаматтық шарттар\",\"q\":\"Сатып алу-сату шартын орындау кезінде тараптар неге сүйенеді?\",\"o\":[\"Тек болжамға\",\"Келісілген талаптар мен заңға\",\"Тек эмоцияға\",\"Тек кездейсоқ кеңеске\"],\"a\":1,\"e\":\"Шарт міндеттемелері келісім және заң талаптарына сай орындалады.\",\"source\":\"11-сынып, «Құқық негіздері», 2-бөлім (Мектеп, 2025), §28 «Сатып алу-сату келісімшарты»\"},{\"grade\":11,\"topic\":\"Азаматтық шарттар\",\"q\":\"Тауар берілгенін дәлелдеуге не көмектеседі?\",\"o\":[\"Тек телефонның түсі\",\"Тек жарнама\",\"Қабылдау құжаты немесе өзге растайтын дерек\",\"Тек ауызша қауесет\"],\"a\":2,\"e\":\"Тауардың берілгенін дәлелдейтін деректер дауды шешуге көмектеседі.\",\"source\":\"11-сынып: PDF оқулықпен нақты параграф сәйкестігі әлі тексерілмеген\"},{\"grade\":11,\"topic\":\"Азаматтық шарттар\",\"q\":\"Шарт тараптарының өзара міндетті болуы нені білдіреді?\",\"o\":[\"Тек бір адамның міндетті болуын\",\"Міндеттің болмауын\",\"Шарттың күшсіздігін\",\"Әр тараптың қарсы тарапқа қатысты міндеті болуын\"],\"a\":3,\"e\":\"Сатып алу-сатуда сатушы мен сатып алушының өзара міндеттері бар.\",\"source\":\"11-сынып: PDF оқулықпен нақты параграф сәйкестігі әлі тексерілмеген\"},{\"grade\":11,\"topic\":\"Азаматтық шарттар\",\"q\":\"Сатып алу-сату шарты бойынша тауар мен ақша қалай байланысады?\",\"o\":[\"Тауар беру мен ақы төлеу өзара міндеттемелер\",\"Тауар әрқашан тегін беріледі\",\"Ақша тек куәгерге беріледі\",\"Тауар тек мемлекетке беріледі\"],\"a\":0,\"e\":\"Сатып алу-сату ақылы шартқа жатады.\",\"source\":\"11-сынып, «Құқық негіздері», 2-бөлім (Мектеп, 2025), §28 «Сатып алу-сату келісімшарты»\"}];\n\n// 9-сыныптың қосымша 33 авторлық жаттығуы. PDF параграфтары әлі толық тексерілмеген.\ngradeQuestions.push(...[{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Құқықтық норманы моральдық нормадан ажырататын белгі қандай?\",\"o\":[\"Мемлекеттік мәжбүрлеумен қамтамасыз етілуі\",\"Тек отбасы ішінде қолданылуы\",\"Тек ауызша берілуі\",\"Міндетті түрде діни болуы\"],\"a\":0,\"e\":\"Құқық нормалары мемлекет тарапынан қорғалады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §1 «Құқық» түсінігі\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Мемлекет аумағы дегеніміз не?\",\"o\":[\"Мемлекет билігі жүретін кеңістік\",\"Тек астана аумағы\",\"Тек тұрғын үйлер\",\"Тек шекара бекеттері\"],\"a\":0,\"e\":\"Мемлекеттік билік белгілі аумақта жүзеге асырылады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Құқықтық қатынастың қатысушысы қалай аталады?\",\"o\":[\"Субъект\",\"Санкция\",\"Гипотеза\",\"Диспозиция\"],\"a\":0,\"e\":\"Субъект — құқықтар мен міндеттерге ие қатысушы. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Құқық нормасының диспозициясы нені білдіреді?\",\"o\":[\"Мінез-құлық ережесін\",\"Мемлекет аумағын\",\"Заңның баспа орнын\",\"Сот ғимаратын\"],\"a\":0,\"e\":\"Диспозиция мінез-құлық ережесін сипаттайды. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Құқық нормасының санкциясы нені көрсетуі мүмкін?\",\"o\":[\"Ереже бұзылғандағы құқықтық салдарды\",\"Тек мерекелер тізімін\",\"Тек құқықтың атауын\",\"Тек мекенжайды\"],\"a\":0,\"e\":\"Санкция құқық бұзушылыққа байланысты құқықтық салдарды білдіруі мүмкін. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Құқықтық мемлекетке тән қағида қандай?\",\"o\":[\"Заң үстемдігі\",\"Лауазымды адамның шексіз билігі\",\"Соттың болмауы\",\"Азаматтардың теңсіздігі\"],\"a\":0,\"e\":\"Құқықтық мемлекетте мемлекеттік билік те заңмен шектеледі. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып, «Құқық негіздері», §2 — Құқықтық мемлекет (тақырыптық сәйкестік; нақты мәтіндік дәлел әлі тексеріледі)\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Азаматтық қоғамға қайсысы мысал болады?\",\"o\":[\"Ерікті қоғамдық бірлестік\",\"Тек министрлік\",\"Тек сот\",\"Тек әкімдік\"],\"a\":0,\"e\":\"Азаматтық қоғамда адамдар ерікті бірлестіктер құра алады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §3 Азаматтық қоғам\"},{\"grade\":9,\"topic\":\"Мемлекет және құқық\",\"q\":\"Заңды мінез-құлық дегеніміз не?\",\"o\":[\"Құқық талаптарына сай әрекет\",\"Міндетті түрде жазаланатын іс\",\"Кез келген қауесет\",\"Құқықты елемеу\"],\"a\":0,\"e\":\"Заңды мінез-құлық құқықтық нормаларға қайшы келмейді. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Конституциялық құқық\",\"q\":\"Конституцияның құқық жүйесіндегі орны қандай?\",\"o\":[\"Негізгі заң\",\"Жай ішкі нұсқаулық\",\"Жеке келісім\",\"Тек мектеп ережесі\"],\"a\":0,\"e\":\"Конституция мемлекеттің негізгі құқықтық қағидаларын бекітеді; қолданыстағы редакция бөлек тексеріледі. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Конституциялық құқық\",\"q\":\"Адамның негізгі құқықтарын қорғауда тәуелсіз соттың рөлі қандай?\",\"o\":[\"Құқықтық дауларды заң негізінде шешу\",\"Заң орнына қауесет қолдану\",\"Тек жарнама жасау\",\"Тек оқу кестесін бекіту\"],\"a\":0,\"e\":\"Сот құқықтарды қорғаудың құқықтық тетіктерінің бірі. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Конституциялық құқық\",\"q\":\"Билікті бөлу қағидаты неге бағытталған?\",\"o\":[\"Биліктің бір қолға шоғырлануын шектеуге\",\"Барлық билікті бір адамға беруге\",\"Соттарды таратуға\",\"Заңдарды жоюға\"],\"a\":0,\"e\":\"Билікті бөлу тежемелік және тепе-теңдік жүйесіне көмектеседі. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып, «Құқық негіздері», §2 — Құқықтық мемлекет (тақырыптық сәйкестік; нақты мәтіндік дәлел әлі тексеріледі)\"},{\"grade\":9,\"topic\":\"Конституциялық құқық\",\"q\":\"Азаматтың өтініш беру құқығы қандай мақсатқа қызмет етеді?\",\"o\":[\"Мүддесін заңды жолмен қорғауға\",\"Тек тауар сатуға\",\"Тек ойын өткізуге\",\"Тек жарнама жасауға\"],\"a\":0,\"e\":\"Өтініш арқылы азамат уәкілетті органға мәселені жеткізе алады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Конституциялық құқық\",\"q\":\"Құқық пен міндеттің байланысын қай тұжырым дұрыс ашады?\",\"o\":[\"Құқықтарды пайдалану өзгелердің құқықтарын құрметтеумен ұштасады\",\"Құқық шексіз\",\"Міндет болмайды\",\"Өзгенің құқығы маңызды емес\"],\"a\":0,\"e\":\"Құқықтарды жүзеге асыру кезінде өзгелердің құқықтары ескеріледі. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Азаматтық құқық\",\"q\":\"Меншік иесінің өкілеттіктері қайсы?\",\"o\":[\"Иелену, пайдалану, билік ету\",\"Тек бақылау\",\"Тек сыйлау\",\"Тек сақтау\"],\"a\":0,\"e\":\"Меншік құқығының негізгі өкілеттіктері осы үшеу.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §9 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Азаматтық құқық\",\"q\":\"Сатып алу-сату шартында кімдер тарап болады?\",\"o\":[\"Сатушы мен сатып алушы\",\"Судья мен куәгер\",\"Мұрагер мен нотариус\",\"Прокурор мен әкім\"],\"a\":0,\"e\":\"Сатып алу-сату шартының тараптары — сатушы мен сатып алушы.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §10 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Азаматтық құқық\",\"q\":\"Мәміле дегеніміз не?\",\"o\":[\"Азаматтық құқықтар мен міндеттерді белгілеуге, өзгертуге немесе тоқтатуға бағытталған әрекет\",\"Тек кездейсоқ оқиға\",\"Тек қылмыстық жаза\",\"Тек спорт жарысы\"],\"a\":0,\"e\":\"Мәміле азаматтық-құқықтық салдарға бағытталады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Азаматтық құқық\",\"q\":\"Тұтынушы сапасыз тауар алса, бірінші кезекте нені сақтағаны дұрыс?\",\"o\":[\"Сатып алуды және кемшілікті растайтын дәлелдерді\",\"Барлық хатты өшіруді\",\"Тауарды жасыруды\",\"Кездейсоқ пікірді\"],\"a\":0,\"e\":\"Чек, тапсырыс және хат алмасу талапты негіздеуге көмектеседі.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §11 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Азаматтық құқық\",\"q\":\"Мүліктік құқықтық қатынасқа қайсысы мысал?\",\"o\":[\"Велосипедті жалға беру\",\"Мемлекеттік туды сипаттау\",\"Мереке атауын жаттау\",\"Спорт нәтижесін болжау\"],\"a\":0,\"e\":\"Жалға беру мүлікті пайдалануға қатысты қатынас туғызады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Азаматтық құқық\",\"q\":\"Шартты орындамау дауын шешуде ең маңызды дәлелдердің бірі қандай?\",\"o\":[\"Шарт талаптары мен орындалу құжаттары\",\"Тек болжам\",\"Тек таныстың пікірі\",\"Тек жарнама\"],\"a\":0,\"e\":\"Тараптардың міндеттері мен орындалуы дәлелдермен анықталады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Еңбек құқығы\",\"q\":\"Еңбек шарты кімдердің арасындағы қатынасты рәсімдейді?\",\"o\":[\"Жұмыскер мен жұмыс берушінің\",\"Сатып алушы мен сатушының ғана\",\"Мұрагер мен мұра қалдырушының\",\"Судья мен айыпталушының\"],\"a\":0,\"e\":\"Еңбек шарты еңбек қатынастарының негізгі құжаты.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §14 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Еңбек құқығы\",\"q\":\"Еңбек қауіпсіздігі ережелерінің негізгі мақсаты қандай?\",\"o\":[\"Жұмыскердің өмірі мен денсаулығын қорғау\",\"Жұмыс уақытын жасыру\",\"Демалысты жою\",\"Жалақыны жасырын төлеу\"],\"a\":0,\"e\":\"Қауіпсіз еңбек жағдайы жұмыскерді қорғауға бағытталған.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §13 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Еңбек құқығы\",\"q\":\"Жұмыс уақыты дегеніміз не?\",\"o\":[\"Жұмыскер еңбек міндетін орындайтын уақыт\",\"Тек демалыс күні\",\"Тек жол жүру уақыты\",\"Тек мереке\"],\"a\":0,\"e\":\"Жұмыс уақыты еңбек міндеттерін орындаумен байланысты.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §12 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Еңбек құқығы\",\"q\":\"Кәмелетке толмағандарды жұмысқа қабылдағанда нені міндетті түрде ескеру керек?\",\"o\":[\"Жас ерекшелігі мен еңбек заңнамасындағы шектеулерді\",\"Тек киім түсін\",\"Тек телефон үлгісін\",\"Тек сынып атауын\"],\"a\":0,\"e\":\"Жасөспірімдердің еңбегіне ерекше талаптар қолданылады.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §13 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Отбасы құқығы\",\"q\":\"Отбасы құқығы негізінен нені реттейді?\",\"o\":[\"Неке және отбасы мүшелерінің құқықтық қатынастарын\",\"Тек кеден рәсімін\",\"Тек салық есебін\",\"Тек жол қозғалысын\"],\"a\":0,\"e\":\"Отбасы құқығы отбасы мүшелерінің құқықтары мен міндеттеріне қатысты.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §15 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Отбасы құқығы\",\"q\":\"Баланың мүддесін ескеру қағидаты нені талап етеді?\",\"o\":[\"Шешімде баланың құқықтары мен мүдделерін ескеруді\",\"Баланың пікірін әрқашан елемеуді\",\"Тек ересектердің пайдасын ойлауды\",\"Баланы құқықсыз санауды\"],\"a\":0,\"e\":\"Баланың құқықтары мен заңды мүдделері қорғалуы тиіс.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §18 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Отбасы құқығы\",\"q\":\"Ата-ананың балаға қатысты негізгі міндеттерінің бірі қандай?\",\"o\":[\"Оны тәрбиелеу және қамқорлық жасау\",\"Білім алуына тыйым салу\",\"Құқығын шектеу\",\"Қауіпсіздігін елемеу\"],\"a\":0,\"e\":\"Ата-аналар баланың тәрбиесі мен әл-ауқатына жауапты.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §17 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Қылмыстық құқық\",\"q\":\"Қылмыстық құқық ең алдымен нені анықтайды?\",\"o\":[\"Қылмыстық құқық бұзушылық пен жауаптылық негіздерін\",\"Тек сауда бағасын\",\"Тек мұра бөлісін\",\"Тек неке тіркеуін\"],\"a\":0,\"e\":\"Қылмыстық құқық құқық бұзушылықтар мен жазалау мәселелерін реттейді.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §24 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Қылмыстық құқық\",\"q\":\"Кінәсіздік презумпциясының мәні қандай?\",\"o\":[\"Кінә заңды тәртіппен дәлелденгенге дейін адам кінәсіз\",\"Кез келген күдік жеткілікті\",\"Куәгердің пікірі үкімге тең\",\"Айыптауды тек әлеуметтік желі шешеді\"],\"a\":0,\"e\":\"Кінәлілік заңда көзделген тәртіппен дәлелденуі керек.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §26 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Қылмыстық құқық\",\"q\":\"Құқық бұзушылықты бағалауда адамның жасы неге маңызды?\",\"o\":[\"Жауаптылықтың жас шектеріне байланысты\",\"Тек бойына байланысты\",\"Тек сыныбына байланысты\",\"Маңызы жоқ\"],\"a\":0,\"e\":\"Жауаптылықтың түріне қарай жасқа қатысты талаптар болады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Әкімшілік құқық\",\"q\":\"Әкімшілік құқық бұзушылық пен қылмыстың ара-жігін не анықтайды?\",\"o\":[\"Заңда белгіленген құқық бұзушылық құрамы мен жауаптылық түрі\",\"Тек оқиға орны\",\"Тек киім үлгісі\",\"Тек әлеуметтік желідегі пікір\"],\"a\":0,\"e\":\"Жауаптылық түрін заң нормасы мен нақты мән-жайлар анықтайды.\",\"source\":\"9-сынып, «Құқық негіздері» (Мектеп, 2019), §20 (PDF оқулықтың мазмұнымен сәйкестендірілді)\"},{\"grade\":9,\"topic\":\"Әкімшілік құқық\",\"q\":\"Құқық бұзушылық бойынша дәлелдеме не үшін қажет?\",\"o\":[\"Мән-жайды объективті анықтау үшін\",\"Тек уақыт өткізу үшін\",\"Тек болжам жасау үшін\",\"Ешқашан қажет емес\"],\"a\":0,\"e\":\"Дәлелдемелер құқықтық шешімнің негізді болуына қызмет етеді. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Құқықтық сауат\",\"q\":\"Заңның қолданыстағы редакциясын қайдан тексерген дұрыс?\",\"o\":[\"Ресми құқықтық ақпарат жүйесінен\",\"Кездейсоқ жазбадан\",\"Ескі суреттен\",\"Жарнамадан\"],\"a\":0,\"e\":\"Ресми құқықтық ақпарат жүйесі нормативтік актіні тексеруге арналған. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"},{\"grade\":9,\"topic\":\"Құқықтық сауат\",\"q\":\"Құқықтық жағдаятты талдаудың дұрыс реті қандай?\",\"o\":[\"Факт — құқықтық мәселе — норма — қорытынды\",\"Пікір — болжам — айыптау\",\"Тек қорытынды\",\"Тек эмоция\"],\"a\":0,\"e\":\"Негізделген талдау факті мен қолданылатын норманы ажыратады. Оқулық тақырыбына негізделген авторлық жаттығу; нақты параграф нөмірі тексерілуде.\",\"source\":\"9-сынып: PDF бойынша нақты параграф анықталмаған\"}]);\nlet gradePool=[],gradePos=0,gradeScore=0,gradeLock=false,gradeCurrent=9;\nconst variantSelect=document.getElementById('variantNo');\nfor(let v=1;v<=40;v++){let opt=document.createElement('option');opt.value=String(v);opt.textContent=v+'-нұсқа';variantSelect.appendChild(opt)}\nfunction setVariant(n){variantSelect.value=String(Math.min(40,Math.max(1,n)));document.getElementById('variantLabel').textContent=variantSelect.value+'-нұсқа / 40';document.querySelectorAll('#variantGrid button').forEach(b=>{const on=b.dataset.variant===variantSelect.value;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});}\nvariantSelect.addEventListener('change',()=>setVariant(Number(variantSelect.value)));\ndocument.getElementById('variantPrev').addEventListener('click',()=>setVariant(Number(variantSelect.value)-1));\ndocument.getElementById('variantNext').addEventListener('click',()=>setVariant(Number(variantSelect.value)+1));\nconst variantGrid=document.getElementById('variantGrid');\nfor(let v=1;v<=40;v++){const b=document.createElement('button');b.type='button';b.dataset.variant=String(v);b.textContent=v+'-нұсқа';b.addEventListener('click',()=>setVariant(v));variantGrid.appendChild(b)}\nsetVariant(1);\nfunction stableShuffle(arr,seed){let a=arr.slice();let x=(seed>>>0)||1;for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;let j=(x>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}\n\nlet gradeReview=[],gradeVariant=1,gradeSaved=false;\nfunction gradeStart(g){gradeCurrent=g;gradeVariant=Number(variantSelect.value);gradePool=stableShuffle(gradeQuestions.filter(x=>x.grade===g),g*1009+gradeVariant*7919);gradePos=0;gradeScore=0;gradeReview=[];gradeSaved=false;go('gradeTests');gradeDraw();}\nfunction gradeDraw(){const el=document.getElementById('gradeQuiz');if(gradePos>=gradePool.length){gradeFinish();return;}gradeLock=false;const q=gradePool[gradePos];el.innerHTML='<div class=\"case\"><span class=\"pill\">'+gradeCurrent+'-сынып · '+gradeVariant+'-нұсқа · '+(gradePos+1)+' / '+gradePool.length+'</span><h3>'+esc(q.q)+'</h3><p class=\"muted\">'+esc(q.topic)+'</p><div id=\"gradeAnswers\"></div><div id=\"gradeFeedback\"></div><button class=\"primary\" id=\"gradeNext\" disabled>Келесі сұрақ →</button></div>';q.o.forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>gradeAnswer(i);document.getElementById('gradeAnswers').appendChild(b)});document.getElementById('gradeNext').onclick=()=>{gradePos++;gradeDraw()};}\nfunction gradeAnswer(i){if(gradeLock)return;gradeLock=true;const q=gradePool[gradePos];if(i===q.a)gradeScore++;gradeReview.push({q:q.q,selected:q.o[i],correct:q.o[q.a],explanation:q.e,source:q.source||'Оқулық тақырыбы; нақты параграф тексерілуде',ok:i===q.a});document.querySelectorAll('#gradeAnswers .choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.getElementById('gradeFeedback');f.className='feedback';f.textContent=(i===q.a?'Дұрыс! ':'Дұрыс жауап: '+q.o[q.a]+'. ')+q.e+' Дереккөз: '+(q.source||'Параграф нақтыланады');document.getElementById('gradeNext').disabled=false;}\nfunction gradeFinish(){const el=document.getElementById('gradeQuiz'),pct=Math.round(gradeScore/gradePool.length*100),wrong=gradeReview.filter(x=>!x.ok);if(!gradeSaved){try{const h=JSON.parse(localStorage.getItem('quqyq-grade-history')||'[]');h.unshift({date:new Date().toLocaleString('kk-KZ'),grade:gradeCurrent,variant:gradeVariant,score:gradeScore,total:gradePool.length,pct,wrong:wrong.length,review:wrong});localStorage.setItem('quqyq-grade-history',JSON.stringify(h.slice(0,50)))}catch(e){}gradeSaved=true;}el.innerHTML='<div class=\"case\"><h3>Нәтиже: '+gradeScore+' / '+gradePool.length+' ('+pct+'%)</h3><p>Қате: '+wrong.length+'. Төменде әр қатенің түсіндірмесі берілген.</p><p class=\"muted\">Оқулық параграфтары мен заңнамалық сілтемелердің бір бөлігі әлі тексерілуде.</p><button class=\"primary\" id=\"gradeRetry\">Қайта тапсыру</button><h3>Қате жауаптарды талдау</h3><div id=\"gradeReviewArea\"></div></div>';document.getElementById('gradeRetry').onclick=()=>gradeStart(gradeCurrent);renderGradeReview(document.getElementById('gradeReviewArea'),wrong);}\nfunction renderGradeReview(el,items){el.innerHTML='';if(!items.length){el.textContent='Барлық жауап дұрыс!';return;}items.forEach((x,i)=>{const d=document.createElement('details');const summary=document.createElement('summary');summary.textContent=(i+1)+'. '+x.q;d.appendChild(summary);[['Сіздің жауабыңыз: ',x.selected],['Дұрыс жауап: ',x.correct],['Түсіндірме: ',x.explanation],['Дереккөз: ',x.source]].forEach(pair=>{const p=document.createElement('p'),b=document.createElement('b');b.textContent=pair[0];p.appendChild(b);p.appendChild(document.createTextNode(pair[1]||'Нақтыланады'));d.appendChild(p)});el.appendChild(d)});}\n(function(){const history=document.getElementById('history');const box=document.createElement('div');box.id='gradeHistoryPanel';box.className='case';history.insertAdjacentElement('afterend',box);const originalShowHistory=showHistory;showHistory=function(){originalShowHistory();let h=[];try{h=JSON.parse(localStorage.getItem('quqyq-grade-history')||'[]')}catch(e){}box.innerHTML='<h3>9–11-сынып тесттерінің нәтижелері</h3>';if(!h.length){const p=document.createElement('p');p.textContent='Әзірге сақталған сыныптық тест жоқ.';box.appendChild(p)}h.forEach((r,i)=>{const d=document.createElement('details'),sum=document.createElement('summary');sum.textContent=(r.grade||'?')+'-сынып · '+(r.variant||'?')+'-нұсқа · '+r.score+'/'+r.total+' ('+r.pct+'%) · '+r.date;d.appendChild(sum);const sub=document.createElement('div');d.appendChild(sub);if(Array.isArray(r.review))renderGradeReview(sub,r.review);else sub.textContent='Бұл бұрынғы нәтиже: сұрақтар бойынша талдау сақталмаған.';box.appendChild(d)})};})();\n<\/script></body></html>\n","animated-original.html":"<!doctype html>\n<html lang=\"kk\">\n<head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"theme-color\" content=\"#102443\"><title>QŪQYQ OLYMP AI | Құқық олимпиадасы</title>\n<style>\n:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#18263b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#102443,#215e91);color:white;padding:32px max(18px,calc((100vw - 1050px)/2)) 38px}.brand{font-weight:800;letter-spacing:.07em;color:#9be7ed}.hero{font-size:clamp(27px,5vw,43px);margin:12px 0}.lead{max-width:670px;line-height:1.65;color:#e0e9f5}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}button,.btn{border:0;cursor:pointer;border-radius:11px;padding:12px 17px;font:inherit;font-weight:650}nav button{background:#ffffff1f;color:white;border:1px solid #ffffff48}nav button.active{background:white;color:#143a60}main{max-width:1050px;margin:2 data-tab=\"curriculum\">🗂️ Оқу картасы</button><button data-tab=\"practicecases\">⚖️ 22 кейс</button></nav></header>\n<main>\n<section id=\"home\" class=\"page\"><div class=\"panel\"><span class=\"pill\">Бастауға дайын</span><h2>Олимпиадаға дайындықты бастаңыз</h2><p class=\"muted\"><strong>Жаңарту ескертпесі:</strong> Конституциялық сұрақтардың бап нөмірлері ресми мәтінмен толық салыстырылғанға дейін көрсетілмейді. Заңнама бөліміндегі ресми сілтемені пайдаланыңыз.</p><p class=\"muted\">Тақырыпты таңдап, тестке өтіңіз. Сұрақтардың түсіндірмелері қателеріңізді талдауға көмектеседі.</p><div class=\"grid\"><div class=\"tile\"><b>12</b><p>Негізгі тест сұрағы</p></div><div class=\"tile\"><b>3</b><p>Құқықтық кейс</p></div><div class=\"tile\"><b>4</b><p>Тест тақырыбы</p></div></div><p><button class=\"primary\" onclick=\"go('quiz')\">Тестті бастау →</button></p></div><div class=\"panel\"><h3>Бұл нұсқада не бар?</h3><p class=\"muted\">Тестке жауап беру, дұрыс жауаптың түсіндірмесін көру, ұпай есептеу, кейстерді талдау, нәтижені осы құрылғыда сақтау. Оқушы тіркелуі мен мұғалімге ортақ статистика әзірге қосылмаған.</p></div></section>\n<section id=\"quiz\" class=\"page hide\"><div class=\"panel\"><h2>Тест орталығы</h2><label for=\"topic\">Тақырыпты таңдаңыз: </label><select id=\"topic\"><option value=\"all\">Барлық тақырып (12 сұрақ)</option><option value=\"constitution\">Конституциялық құқық</option><option value=\"criminal\">Қылмыстық құқық</option><option value=\"civil\">Азаматтық және отбасы құқығы</option><option value=\"labor\">Еңбек және әкімшілік құқық</option></select><button class=\"primary\" id=\"startBtn\">Жаңа тест</button><div id=\"quizArea\" aria-live=\"polite\"><p class=\"muted\">Тестті бастау үшін «Жаңа тест» батырмасын басыңыз.</p></div></div></section>\n<section id=\"cases\" class=\"page hide\"><div class=\"panel\"><h2>Құқықтық кейстер зертханасы</h2><p class=\"muted\">Жауабыңызды жазып, үлгі талдаумен салыстырыңыз. Бұл бөлім автоматты баға қоймайды.</p><div id=\"casesArea\"></div></div></section>\n<section id=\"library\" class=\"page hide\"><div class=\"panel\"><h2>Заңнама кітапханасы</h2><p class=\"pill\">Конституция: 01.07.2026 бастап қолданыстағы редакция</p><p class=\"muted\">Нормативтік актілердің қолданыстағы редакциясын ресми дереккөзден тексеріңіз. Заңнама өзгеруі мүмкін.</p><div class=\"grid\"><div class=\"tile\"><h3>ҚР Конституциясы (2026)</h3><p class=\"muted\">2026 жылғы 15 наурызда қабылданған, 2026 жылғы 1 шілдеден қолданыстағы Конституция. Ресми мәтінін Әділет жүйесінен қараңыз.</p><p><a href=\"https://adilet.zan.kz/kaz/docs/K2600000000\" target=\"_blank\" rel=\"noopener noreferrer\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Қылмыстық кодекс</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K1400000226\" target=\"_blank\" rel=\"noopener noreferrer\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Еңбек кодексі</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K1500000414\" target=\"_blank\" rel=\"noopener noreferrer\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Азаматтық кодекс (жалпы бөлім)</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K940001000_\" target=\"_blank\" rel=\"noopener noreferrer\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Неке (ерлі-зайыптылық) және отбасы туралы кодекс</h3><p><a href=\"https://adilet.zan.kz/kaz/docs/K1100000518\" target=\"_blank\" rel=\"noopener noreferrer\">Әділет жүйесінде оқу ↗</a></p></div><div class=\"tile\"><h3>Құқықтық ақпарат</h3><p><a href=\"https://adilet.zan.kz/kaz\" target=\"_blank\" rel=\"noopener noreferrer\">Құжаттарды іздеу ↗</a></p></div></div></div></section>\n<section id=\"books\" class=\"page hide\"><div class=\"panel\"><span class=\"pill\">ЖАҢА БӨЛІМ · 9–11-СЫНЫП</span><h2>📚 Оқы → Ойлан → Орында</h2><p class=\"muted\">Бес оқулықтың тақырыптары бойынша дайындал. Оқулықтардың толық PDF файлдары бұл сайтқа көшірілмеген. Кітаптарды өзіңіздегі нұсқадан оқыңыз немесе құқық иесі рұқсат берген электрондық нұсқасын іздеңіз.</p><div class=\"grid\" id=\"bookCards\"></div></div><div class=\"panel\"><h2>Тақырыптық жаттығу</h2><p class=\"muted\">Тақырыпты таңдаңыз. Бұл — оқулық ұғымдарына арналған авторлық жаттығулар; нақты заң баптары үшін «Заңнама» бөліміндегі ресми мәтінді қараңыз.</p><label for=\"bookTopic\">Тақырып:</label> <select id=\"bookTopic\"></select><button class=\"primary\" id=\"bookStart\">Тапсырманы бастау</button><div id=\"bookQuiz\" aria-live=\"polite\"></div></div></section>\n<section id=\"olympiad\" class=\"page hide\"><div class=\"panel\"><span class=\"pill\">🏆 ОЛИМПИАДА РЕЖИМІ</span><h2>Білім сайысы · 9–11 сынып</h2><p class=\"muted\">Уақыт шектеуі бар жаттығу. Бұл ресми олимпиада емес. Сұрақтар құқықтық ұғымдарды түсінуге бағытталған; нақты заң баптарын ресми дереккөзден тексеріңіз.</p><label for=\"olympLevel\">Күрделілік деңгейі:</label> <select id=\"olympLevel\"><option value=\"easy\">Жеңіл · 8 сұрақ · 10 минут</option><option value=\"medium\">Орташа · 12 сұрақ · 15 минут</option><option value=\"hard\">Күрделі · 16 сұрақ · 20 минут</option></select> <button class=\"primary\" id=\"olympStart\" type=\"button\">Олимпиаданы бастау</button><div class=\"olymp-grid\"><div class=\"olymp-stat\">Уақыт<strong id=\"olympTime\">—</strong></div><div class=\"olymp-stat\">Ұпай<strong id=\"olympScore\">0</strong></div><div class=\"olymp-stat\">Сұрақ<strong id=\"olympCount\">0 / 0</strong></div></div><div id=\"olympProgress\"><div id=\"olympBar\"></div></div><div id=\"olympQuestion\" style=\"margin-top:20px\"></div><div id=\"olympFeedback\"></div><button type=\"button\" id=\"olympNext\" style=\"display:none\">Келесі сұрақ →</button></div></section>\n<section id=\"curriculum\" class=\"page hide\"><div class=\"panel\"><span class=\"pill\">9–11 СЫНЫП · ОҚУ БАҒДАРЫ</span><h2>Тақырыптар бойынша оқу картасы</h2><p class=\"muted\">Төмендегі тақырыптар — оқу бағытын көрсетуге арналған топтамалар; оқулықтағы параграф нөмірлері мен нақты атаулары әлі толық сәйкестендірілмеген.</p><div class=\"grid\"><div class=\"tile\"><h3>9-сынып</h3><details><summary>Мемлекет және құқық</summary><p class=\"muted\">Құқық нормасы, құқықтық қатынас, құқық бұзушылық</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Конституциялық құқық</summary><p class=\"muted\">Мемлекеттік билік, азаматтардың құқықтары</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Азаматтық құқық</summary><p class=\"muted\">Меншік, мәміле, тұтынушы</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Еңбек құқығы</summary><p class=\"muted\">Еңбек шарты, жұмыс уақыты</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Отбасы құқығы</summary><p class=\"muted\">Неке, ата-ана мен баланың құқықтары</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Қылмыстық және әкімшілік құқық</summary><p class=\"muted\">Жауапкершілік және құқық бұзушылық</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>10-сынып · I бөлім</h3><details><summary>Мемлекет пен құқықтың пайда болуы</summary><p class=\"muted\">Мемлекет белгілері, құқық ұғымы</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Құқықтың қайнар көздері</summary><p class=\"muted\">Нормативтік құқықтық актілер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Құқықтық қатынастар</summary><p class=\"muted\">Субъект, объект, мазмұн</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Конституциялық құрылыс</summary><p class=\"muted\">Мемлекет және азамат</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>10-сынып · II бөлім</h3><details><summary>Азаматтық құқық</summary><p class=\"muted\">Мәмілелер және меншік</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Міндеттемелік құқық</summary><p class=\"muted\">Шарттар және міндеттемелер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Отбасы және еңбек құқығы</summary><p class=\"muted\">Құқықтар мен міндеттер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Іс жүргізу негіздері</summary><p class=\"muted\">Дәлелдеме және рәсім</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>11-сынып · I бөлім</h3><details><summary>Құқықтық мемлекет</summary><p class=\"muted\">Заң үстемдігі және билік</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Адам құқықтары</summary><p class=\"muted\">Құқықтарды қорғау</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Әкімшілік құқық</summary><p class=\"muted\">Әкімшілік құқықтық қатынастар</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Қылмыстық құқық</summary><p class=\"muted\">Қылмыс құрамы және жауаптылық</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div><div class=\"tile\"><h3>11-сынып · II бөлім</h3><details><summary>Азаматтық-құқықтық шарттар</summary><p class=\"muted\">Шарттың тараптары мен шарттары</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Мұрагерлік құқық</summary><p class=\"muted\">Мұрагерлер және мұра</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Тұтынушылар құқығы</summary><p class=\"muted\">Сапа және шағым</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details><details><summary>Құқықтық даулар</summary><p class=\"muted\">Талап және дәлелдемелер</p><p>Оқулықтан осы тақырыпты оқып, төмендегі тақырыптық тестті орындаңыз.</p></details></div></div><p><button class=\"primary\" onclick=\"go('books')\">Оқулық тапсырмалары →</button></p></div></section><section id=\"practicecases\" class=\"page hide\"><div class=\"panel\"><span class=\"pill\">22 ҚОСЫМША ЖАҒДАЯТ</span><h2>Құқықтық жағдайды талдау</h2><p class=\"muted\">Модельдік оқу жағдаяттары. Нақты істерде қолданыстағы заң мәтінін тексеріңіз.</p><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 1</span><h3>Сатып алынған құлаққап екі күннен кейін жұмыс істемей қалды.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Сатып алу деректерін сақтап, сатушыға жазбаша талап қою; тауардың кемшілігін және тұтынушының заңдағы талаптарын анықтау.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 2</span><h3>Оқушының суретін сыныптасы рұқсатсыз жариялады.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Жарияланымның мән-жайын, жеке өмір және бейне құқықтарын тексеру; өшіруді сұрау және қажет болса заңды өкілге жүгіну.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 3</span><h3>Оқушы жұмысқа орналасқысы келеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Жасын, жұмыс түрін, оқу уақытына әсерін, заңды өкіл келісімі қажет болуын және еңбек шартын тексеру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 4</span><h3>Көрші қатты шу шығарып, тұрғындарға кедергі жасады.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Оқиға уақытын, дәлелдерін, жергілікті тәртіп нормаларын анықтап, уәкілетті органға заңды тәртіппен жүгіну.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">9-сынып · Жағдаят 5</span><h3>Оқушы досының затын рұқсатсыз алды.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Меншік иесінің құқықтарын, ниетін, келтірілген залалды және жасына байланысты жауаптылық шарттарын ажырату.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 6</span><h3>Дүкен баға белгісінде бір сома, кассада басқа сома көрсетті.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Баға туралы ақпарат пен төлем дәлелін салыстырып, тұтынушының ақпарат алу құқығын және талап қою тәртібін тексеру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 7</span><h3>Интернет-дүкен тауарды жеткізбеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Тапсырыс пен төлем дәлелін сақтап, шарттың талаптарын тексеру, сатушыға талап жіберу.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 8</span><h3>Азамат велосипедін досына уақытша берді, бірақ қайтармады.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Берудің құқықтық негізін, тараптардың келісімін, затқа меншік құқығын және қайтару талабын анықтау.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 9</span><h3>Жұмыс беруші қызметкерге шарт көшірмесін бермеді.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз...\"></textarea><details><summary>Үлгі талдауды ашу</summary><p>Еңбек шартының рәсімделуін, қызметкердің құқықтарын және еңбек инспекциясына жүгіну мүмкіндігін қарастыру.</p><p class=\"muted\">Нақты бап пен қолданыстағы редакцияны «Заңнама» бөлімінен тексеріңіз.</p></details></div><div class=\"case\"><span class=\"pill\">10-сынып · Жағдаят 10</span><h3>Сатып алушы заттың жасырын ақауын тапты.</h3><p class=\"muted\">Тапсырма: фактілерді, құқықтық мәселені, қолданылатын норманы және қорытындыны жазыңыз.</p><textarea placeholder=\"Өз талдауыңызды жазыңыз... ылғы Конституцияның ең жоғары заңдық күші бар. Бап нөмірін заңнаманың ресми мәтінімен салыстырып тексеріңіз.'},\n{t:'criminal',q:'Қылмыстық жауаптылықтың жалпы басталу жасы қандай?',o:['14 жас','15 жас','16 жас','18 жас'],a:2,e:'ҚР Қылмыстық кодексінің 15-бабы: жалпы ереже бойынша 16 жас, ал заңда көрсетілген кейбір қылмыстар үшін 14 жас.'},\n{t:'criminal',q:'Адамның кінәлі екендігін кімнің заңды күшіне енген үкімі анықтайды?',o:['Полицияның','Соттың','Прокурордың','Әкімдіктің'],a:1,e:'Кінәсіздік презумпциясы: адамның кінәсі заңда белгіленген тәртіппен дәлелденіп, заңды күшіне енген сот үкімімен анықталғанға дейін ол кінәсіз деп есептеледі. 2026 жылғы Конституциядағы нақты бап нөмірін ресми мәтіннен тексеріңіз.'},\n{t:'criminal',q:'Қылмыстық құқықтағы кінәсіздік презумпциясы нені білдіреді?',o:['Айыпталушы міндетті түрде кінәлі','Кінә дәлелденгенге дейін адам кінәсіз саналады','Кез келген куәлік жеткілікті','Сот қажет емес'],a:1,e:'Кінәлілік заңда белгіленген тәртіппен дәлелденіп, заңды күшіне енген сот үкімімен анықталуы керек.'},\n{t:'civil',q:'Азаматтық құқық қабілеттілігі қашан пайда болады?',o:['16 жаста','18 жаста','Туған кезде','Мектепке барған кезде'],a:2,e:'ҚР Азаматтық кодексінің 13-бабы: азаматтық құқық қабілеттілігі туған кезден басталып, қайтыс болғанда тоқтатылады.'},\n{t:'civil',q:'Азаматтық әрекет қабілеттілігі толық көлемде, жалпы ереже бойынша, нешеде пайда болады?',o:['14 жаста','16 жаста','18 жаста','21 жаста'],a:2,e:'ҚР Азаматтық кодексінің 17-бабы: толық әрекет қабілеттілігі жалпы ереже бойынша 18 жасқа толғанда пайда болады; заңда ерекшеліктер бар.'},\n{t:'civil',q:'Ата-ана мен баланың құқықтары және міндеттері негізінен қай құқық саласында қаралады?',o:['Отбасы құқығы','Қылмыстық құқық','Салық құқығы','Халықаралық жария құқық'],a:0,e:'Ата-аналар мен балалар арасындағы отбасылық қатынастар неке (ерлі-зайыптылық) және отбасы туралы заңнамамен реттеледі.'},\n{t:'labor',q:'Еңбек қатынастарының туындауына әдетте не негіз болады?',o:['Ауызша уәде ғ
