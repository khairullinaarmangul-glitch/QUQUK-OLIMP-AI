('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='results')showHistory();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}}document.querySelectorAll('nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab))); \nlet pool=[],at=0,selected=null,score=0;const area=document.getElementById('quizArea');const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction start(){const topic=document.getElementById('topic').value;pool=questions.filter(q=>topic==='all'||q.t===topic);at=0;score=0;renderQuestion()}function renderQuestion(){selected=null;if(at>=pool.length){finish();return}const q=pool[at];area.innerHTML=`<p class=\"pill\">Сұрақ ${at+1} / ${pool.length}</p><div class=\"progress\"><div class=\"bar\" style=\"width:${at/pool.length*100}%\"></div></div><h3>${esc(q.q)}</h3><div id=\"options\"></div><div id=\"explanation\" aria-live=\"polite\"></div><div class=\"actions\"><span class=\"muted\">Әр дұрыс жауап — 1 ұпай</span><button class=\"primary\" id=\"next\" disabled>${at===pool.length-1?'Нәтижені көру':'Келесі сұрақ →'}</button></div>`;const options=document.getElementById('options');q.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>answer(i);options.appendChild(b)});document.getElementById('next').onclick=()=>{at++;renderQuestion()}}\nfunction answer(i){if(selected!==null)return;selected=i;const q=pool[at];if(i===q.a)score++;document.querySelectorAll('#options button').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('explanation').innerHTML=`<div class=\"feedback\"><b>${i===q.a?'✓ Дұрыс!':'Дұрыс жауап: '+String.fromCharCode(65+q.a)+'. '+esc(q.o[q.a])}</b><p>${esc(q.e)}</p></div>`;document.getElementById('next').disabled=false}\nfunction finish(){const pct=Math.round(score/pool.length*100);const record={date:new Date().toLocaleString('kk-KZ'),score,total:pool.length,pct,topic:document.getElementById('topic').selectedOptions[0].textContent};try{const h=JSON.parse(localStorage.getItem('quqyq-history')||'[]');h.unshift(record);localStorage.setItem('quqyq-history',JSON.stringify(h.slice(0,30)))}catch(e){}area.innerHTML=`<h3>Тест аяқталды!</h3><p style=\"font-size:30px;font-weight:800;color:#146c96\">${score} / ${pool.length} (${pct}%)</p><p class=\"muted\">${pct>=80?'Өте жақсы нәтиже!':pct>=50?'Жақсы бастама. Түсіндірмелерді қайталаңыз.':'Тақырыптарды қайта оқып, тағы бір рет орындаңыз.'}</p><button class=\"primary\" onclick=\"start()\">Қайта тапсыру</button> <button class=\"secondary\" onclick=\"go('results')\">Нәтижелер</button>`}\ndocument.getElementById('startBtn').onclick=start;\nconst caseArea=document.getElementById('casesArea');cases.forEach((c,i)=>{const div=document.createElement('div');div.className='case';div.innerHTML=`<span class=\"pill\">Кейс ${i+1}</span><h3>${esc(c.q)}</h3><label for=\"case${i}\">Сіздің талдауыңыз:</label><textarea id=\"case${i}\" placeholder=\"Қандай заң нормасы қолданылады? Неліктен?\"></textarea><div class=\"actions\"><button class=\"secondary\">Үлгі талдауды көрсету</button></div><div class=\"feedback hide\">${esc(c.a)}</div>`;div.querySelector('button').onclick=()=>div.querySelector('.feedback').classList.toggle('hide');caseArea.appendChild(div)});\nfunction showHistory(){const el=document.getElementById('history');let h=[];try{h=JSON.parse(localStorage.getItem('quqyq-history')||'[]')}catch(e){}el.innerHTML=h.length?h.map(x=>`<div class=\"case\"><b>${esc(x.score)} / ${esc(x.total)} (${esc(x.pct)}%)</b><p class=\"muted\">${esc(x.topic)} · ${esc(x.date)}</p></div>`).join(''):'<p class=\"muted\">Әзірге нәтиже жоқ. Алғашқы тестті орындаңыз.</p>'}document.getElementById('clearBtn').onclick=()=>{if(confirm('Осы браузердегі барлық нәтижені өшіресіз бе?')){localStorage.remov осы браузерде сақталады. Мұғалімге нәтиженің скриншотын немесе есеп файлын жіберіңіз.</div>${page()}<footer class="footer"><span>QŪQYQ OLYMP AI · Құқық олимпиадасына саналы дайындық</span><span>Қазақ тілінде · 9–11-сынып · Premium Legal</span></footer></main></div>`;
}
function page(){return ({home:homePage,library:libraryPage,practice:practicePage,collections:collectionsPage,mistakes:mistakesPage,progress:progressPage,teacher:teacherPage,archive:archivePage,sources:sourcesPage}[view]||homePage)()}
function stats(){return `<div class="stats"><div class="stat"><div class="stat-icon">${I('check')}</div><div><strong>${done().length}</strong><small>Аяқталған жаттығу</small></div><em>Жеке нәтиже</em></div><div class="stat"><div class="stat-icon">${I('chart')}</div><div><strong>${done().length?avg()+'%':'—'}</strong><small>Дұрыс жауап үлесі</small></div></div><div class="stat"><div class="stat-icon">${I('repeat')}</div><div><strong>${wrongIds().length}</strong><small>Қайталауға сұрақ</small></div></div></div>`}
function homePage(){const active=state.attempts.find(x=>!x.complete),paras=state.items.filter(x=>x.kind==='paragraph'&&x.status==='verified').slice(0,3);return head('Бүгінгі қадам — ертеңгі жеңіс','Біліміңізді толықтырыңыз, жаттығыңыз және ілгерілеуіңізді бақылаңыз.')+`<section class="hero"><div><div class="eyebrow">БІЛІМНЕН — ДӘЛЕЛДІ ЖАУАПҚА</div><h2>Құқықты жаттап қана қоймай,<br>түсініп үйреніңіз.</h2><p>Конституцияны зерттеңіз. Құқықтық жағдаяттарды шешіңіз. Әр жауабыңызбен олимпиадаға бір қадам жақындаңыз.</p><div class="actions">${btn((active?'Жаттығуды жалғастыру':'Жаттығуды бастау')+' '+I('arrow'),active?'resume':'start',active?`data-id="${active.id}"`:'','gold')}${btn('Кітапхананы ашу','nav','data-view="library"','ghost')}</div></div><svg class="hero-art" viewBox="0 0 220 210" aria-hidden="true"><circle cx="111" cy="99" r="82"/><circle cx="111" cy="99" r="66"/><path d="M111 30v117M59 147h104M82 163h59M54 65h114M63 65l-23 45h46zM159 65l-23 45h46zM98 49l13-14 13 14M44 180h134M66 190h90"/><path d="M59 147h104v16H59zM75 163h73v17H75z"/></svg></section>${stats()}<div class="dashboard-grid"><section><div class="section-top"><h2>Білімді негізден бастаңыз</h2><button class="textbtn" data-action="nav" data-view="library">Барлық материал ${I('arrow')}</button></div>${paras.map(x=>`<article class="card lesson"><div class="lesson-icon">${I('book')}</div><div><div class="tags">${tag(x)}<span class="tag">${x.grade}-сынып</span></div><h3>${esc(x.title)}</h3><p>Конституция · ${esc(x.article)}-бап</p></div><div class="actions">${btn('Оқу '+I('arrow'),'read',`data-id="${x.id}"`,'small')}</div></article>`).join('')}<div class="section-top"><h2>Соңғы жаттығулар</h2><button class="textbtn" data-action="nav" data-view="progress">Барлық нәтиже</button></div>${state.attempts.length?attemptTable(state.attempts.slice(0,3)):`<div class="card"><p class="small-note">Алғашқы жаттығудан кейін нәтижелеріңіз осында көрінеді. Әр жауап осы браузерде сақталады.</p>${btn('Алғашқы жаттығу '+I('play'),'start','','small primary')}</div>`}</section><aside class="rightcol"><div class="card article-card"><div class="eyebrow">БҮГІНГІ ҚАҒИДА</div><span class="article-number">19<span class="label-inline">-бап</span></span><h3>Кінәсіздік презумпциясы</h3><p>Сот үкімі заңды күшіне енгенге дейін адамды қылмыстық құқық бұзушылыққа кінәлі деп санауға болмайды.</p>${btn('Жағдаятты талдау '+I('arrow'),'read','data-id="k26-case19"','small')}</div><div class="card"><div class="tags"><span class="tag verified">Ресми негіз</span></div><h3>2026 жылғы Конституция</h3><p class="small-note">Тексерілген оқу сұрақтары мен бұрынғы материалдардың мәртебесі жеке көрсетіледі.</p><button class="textbtn" data-action="nav" data-view="sources">Дереккөздер мен редакция ${I('arrow')}</button></div></aside></div>`}
function filtered(teacher=false){const q=query.trim().toLocaleLowerCase('kk-KZ'),num=q.match(/^(?:бап\s*)?(\d+)\s*(?:-?\s*бап)?$/)?.[1];return state.items.filter(x=> (teacher||x.status!=='archived')&&(kind==='all'||x.kind===kind)&&(!category||x.category===category)&&(!grade||String(x.grade)===grade)&&(!status||x.status===status)&&(!q||(num?String(x.article)===num:[x.title,x.body,x.explanation,x.category,x.article].filter(Boolean).join(' ').toLocaleLowerCase('kk-KZ').includes(q))))}
function filters(teacher=false){const cats=[...new Set(state.items.map(x=>x.category))].sort();return `<div class="filters"><input id="filter-query" aria-label="Іздеу" placeholder="Атау, ұғым немесе 19-бап…" value="${esc(query)}"><select id="filter-category" aria-label="Құқық саласы"><option value="">Барлық санат</option>${cats.map(x=>`<option ${category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="filter-grade" aria-label="Сынып"><option value="">Барлық сынып</option>${[9,10,11].map(x=>`<option value="${x}" ${grade===String(x)?'selected':''}>${x}-сынып</option>`).join('')}</select><select id="filter-status" aria-label="Тексеру мәртебесі"><option value="">Барлық мәртебе</option>${Object.entries(statusNames).filter(([v])=>teacher||v!=='archived').map(([v,t])=>`<option value="${v}" ${status===v?'selected':''}>${t}</option>`).join('')}</select>${btn('Іздеу','filter','','small')}</div>`}
function tabs(){return `<div class="tabs" role="group" aria-label="Материал түрі">${[['all','Барлығы'],['paragraph','Параграфтар'],['question','Тест сұрақтары'],['case','Құқықтық жағдаяттар']].map(([k,t])=>`<button data-action="kind" data-kind="${k}" class="${kind===k?'active':''}" aria-pressed="${kind===k}">${t}</button>`).join('')}</div>`}
function itemCard(x){return `<article class="card"><div class="tags">${tag(x)}<span class="tag">${x.grade||9}-сынып</span><span class="tag">${x.kind==='question'?'Тест':x.kind==='case'?'Жағдаят':'Параграф'}</span></div><h3>${esc(x.title)}</h3><p class="excerpt">${esc((x.body||x.category||'').slice(0,160))}${(x.body||'').length>160?'…':''}</p><div class="meta"><span>${esc(x.category)}</span>${x.article?`<span>${esc(x.article)}-бап</span>`:''}</div><div class="actions">${btn(x.kind==='question'?'Сұрақты ашу':'Материалды оқу','read',`data-id="${x.id}"`,'small')}${btn(I('save'),'bookmark',`data-id="${x.id}" aria-label="Жеке жинаққа қосу"`,'small save-icon')}${mode==='teacher'&&state.me.role==='teacher'?btn('Өңдеу','edit',`data-id="${x.id}"`,'small'):''}</div></article>`}
function libraryPage(){const items=filtered();return head('Білім кітапханасы','Параграфтар, тест сұрақтары және құқықтық жағдаяттар бір жерде.')+tabs()+filters()+`<p class="small-note">${items.length} материал · «Тексеру қажет» материалдары бастапқы күйінде сақталған; расталған жаттығуға тек тексерілген сұрақтар кіреді.</p><div class="itemgrid">${items.slice(0,80).map(itemCard).join('')}</div>${items.length>80?'<p class="small-note">Алғашқы 80 материал көрсетілді. Іздеуді немесе санат сүзгісін нақтылаңыз.</p>':''}${!items.length?empty('Материал табылмады','Басқа сөзбен іздеп немесе сүзгілерді тазалап көріңіз.'):''}`}
function practicePage(){if(session)return quizPage();const active=state.attempts.filter(x=>!x.complete),verified=state.items.filter(x=>x.kind==='question'&&x.status==='verified');return head('Білімді тәжірибеде бекітіңіз','Әр жауаптан кейін түсіндірме беріледі және нәтиже осы браузерде сақталады.')+`<div class="dashboard-grid"><div><div class="card"><div class="tags"><span class="tag verified">${verified.length} тексерілген сұрақ</span></div><h2>Тақырыптық жаттығу</h2><p class="small-note">Құқық саласын таңдап, қысқа жаттығудан бастаңыз.</p><form id="practice-form" class="form-grid"><div class="field"><label for="practice-category">Құқық саласы</label><select id="practice-category" name="category"><option value="">Барлық сала</option>${[...new Set(verified.map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="practice-grade">Сынып</label><select id="practice-grade" name="grade"><option value="">Барлық сынып</option><option value="9">9-сынып</option><option value="10">10-сынып</option><option value="11">11-сынып</option></select></div><div class="field"><label for="practice-limit">Сұрақ саны</label><select id="practice-limit" name="limit"><option value="10">10 сұраққа дейін</option><option value="20">20 сұраққа дейін</option><option value="50">50 сұраққа дейін</option></select></div><div class="field"><label>&nbsp;</label><button class="btn primary" type="submit">Жаттығуды бастау ${I('play')}</button></div></form></div>${active.length?`<h2>Аяқталмаған жаттығулар</h2>${attemptTable(active)}`:''}<div class="section-top"><h2>Құқықтық жағдаяттар</h2></div><div class="itemgrid">${state.items.filter(x=>x.kind==='case'&&x.status==='verified').map(itemCard).join('')}</div></div><aside><div class="card article-card"><div class="lesson-icon">${I('repeat')}</div><h3>Қате — оқу бағыты</h3><p>Қате жауаптардан жеке қайталау тізімі автоматты жасалады. Дұрыс қайталаған сұрақ тізімнен шығады.</p>${btn('Қателерді қайталау','mistake-start','','small')}</div><div class="card"><h3>Қалай сақталады?</h3><p class="small-note">Әр жауап осы браузерде сақталады. Бетті жапсаңыз да, аяқталмаған жаттығуды жалғастыра аласыз.</p></div></aside></div>`}
function quizPage(){const q=session.questions[pos];if(!q)return `<div class="quiz"><div class="card"><span class="tag verified">Жаттығу аяқталды</span><h2>Бүгінгі нәтижеңіз</h2><div class="score-big">${lastSummary?.score||0}<span class="label-inline"> / ${lastSummary?.total||session.questions.length}</span></div><p class="small-note">Нәтиже мен әр жауап осы браузерде сақталды. Қате сұрақтар қайталау тізіміне қосылды. Мұғалімге нәтижеңіздің скриншотын немесе жүктелген есепті жіберіңіз.</p><div class="actions">${btn('Нәтижелерді көру','quiz-close','','primary')}${btn('Қателерді қайталау','mistake-start')}</div></div></div>`;return head('Ойлан. Таңда. Дәлелде.','Әр сұрақ — құқықтық ойлау дағдысына жаттығу.')+`<div class="quiz"><div class="card"><div class="quiz-top"><span>${esc(q.category)}</span><span>${pos+1} / ${session.questions.length}</span></div><progress value="${pos}" max="${session.questions.length}" aria-label="Жаттығу барысы"></progress><div class="tags">${tag(q)}<span class="tag">${esc(q.article)}-бап</span></div><h2>${esc(q.title)}</h2>${q.options.map((o,i)=>`<button class="option ${feedback?(i===feedback.answer?'correct':i===feedback.selected?'wrong':''):''}" data-action="answer" data-answer="${i}" ${feedback?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}${feedback?`<div class="feedback" role="status"><strong>${feedback.correct?'✓ Дұрыс жауап':'Қате жауап. Дұрыс нұсқа: '+String.fromCharCode(65+feedback.answer)}</strong><p>${esc(feedback.explanation)}</p>${sourceLink(feedback.sourceUrl,feedback.article)}</div>`:''}<div class="quiz-bottom"><span class="small-note">${I('shield')} Жауабыңыз автоматты сақталады</span>${feedback?btn(pos===session.questions.length-1?'Нәтижені көру':'Келесі сұрақ '+I('arrow'),'next','','primary'):''}</div></div>${btn('Кейін жалғастыру','pause','','small')}</div>`}
function collectionsPage(){const list=state.personal.collections||[];return head('Өзіңізге ыңғайлы оқу бағыты','Тақырыптарды бір жинаққа қосып, кез келген уақытта қайталаңыз.')+`<form id="new-collection" class="inline-form"><input name="name" aria-label="Жаңа жинақ атауы" placeholder="Жаңа жинақ атауы…" maxlength="100" required><button class="btn primary">${I('plus')} Жинақ жасау</button></form>${list.map(c=>`<div class="card collection-row"><div class="lesson-icon">${I('folder')}</div><div><h3>${esc(c.name)}</h3><p>${c.ids.length} материал · ${c.ids.map(byId).filter(x=>x?.kind==='question'&&x.status==='verified').length} тексерілген сұрақ</p></div><div class="actions">${btn('Материалдар','collection-open',`data-id="${c.id}"`,'small')}${btn('Жаттығу '+I('play'),'collection-start',`data-id="${c.id}"`,'small primary')}</div></div>`).join('')}${!list.length?empty('Алғашқы жинағыңызды жасаңыз','Кітапханадағы бетбелгі батырмасымен сұрақ пен параграфты жинаққа қосыңыз.'):''}`}
function mistakesPage(){const ids=wrongIds(),items=ids.map(byId).filter(Boolean);return head('Қателерді білімге айналдырыңыз','Соңғы жауабыңыз қате болған сұрақтар осында автоматты жиналады.',ids.length?btn('Барлығын қайталау '+I('repeat'),'mistake-start','','primary'):'')+`<div class="banner good">Соңғы қайталауда дұрыс жауап берген сұрақ бұл тізімнен автоматты шығады. Бұрынғы нәтижелер сақталады.</div><div class="itemgrid">${items.map(itemCard).join('')}</div>${!items.length?empty('Қайталауды қажет ететін сұрақ жоқ','Жаттығудан бастаңыз. Қателескен сұрақтарыңыз осы жерге жиналады.','practice','Жаттығуға өту'):''}`}
function attemptTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Күні</th><th>Нәтиже</th><th>Күйі</th><th>Әрекет</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${date(x.date)}</td><td><strong>${x.score} / ${x.complete?x.total:x.answered}</strong><small>${x.answered?x.pct+'%':'Әзірге жауап жоқ'}</small></td><td><span class="tag ${x.complete?'verified':'pending'}">${x.complete?'Аяқталған':x.answered+'/'+x.total+' жауап'}</span></td><td>${btn(x.complete?'Талдау':'Жалғастыру',x.complete?'attempt-read':'resume',`data-id="${x.id}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`}
function progressPage(){return head('Ілгерілеуіңіз көрініп тұрсын','Тек өз жауаптарыңызға негізделген жеке нәтижелер.')+stats()+`<div class="card"><div class="section-top"><h2>Соңғы аяқталған жаттығулар</h2><span class="small-note">Дұрыс жауап үлесі</span></div>${done().length?`<div class="chart">${done().slice(0,8).reverse().map(a=>`<div class="chart-item"><strong>${a.pct}%</strong><progress value="${a.pct}" max="100" aria-label="${date(a.date)}: ${a.pct}%"></progress><span>${date(a.date)}</span></div>`).join('')}</div>`:'<p class="small-note">Диаграмма алғашқы аяқталған жаттығудан кейін пайда болады.</p>'}</div><div class="section-top"><h2>Барлық талпыныс</h2>${btn('Есепті жүктеу '+I('download'),'report','','small')}</div>${state.attempts.length?attemptTable(state.attempts):empty('Әзірге нәтиже жоқ','Жаттығу аяқталғанда ұпайыңыз бен қате сұрақтар сақталады.','practice','Жаттығуды бастау')}`}
function teacherPage(){if(state.me.role!=='teacher')return empty('Қолжетімділік шектелген','Бұл бөлім мұғалім тіркелгісіне арналған.');const items=filtered(true);return head('Білім мазмұнын басқарыңыз','Әр материалдың дереккөзін, редакциясын және тексеру тарихын сақтаңыз.',btn(I('plus')+' Материал қосу','create','','primary'))+`<div class="stats"><div class="stat"><div class="stat-icon">${I('book')}</div><div><strong>${state.items.length}</strong><small>Барлық материал</small></div></div><div class="stat"><div class="stat-icon">${I('shield')}</div><div><strong>${state.items.filter(x=>x.status==='verified').length}</strong><small>Тексерілген</small></div></div><div class="stat"><div class="stat-icon">${I('clock')}</div><div><strong>${state.items.filter(x=>['pending','update'].includes(x.status)).length}</strong><small>Салыстыру күтіп тұр</small></div></div></div><div class="card"><h3>Ресми нормамен салыстыру</h3><p class="small-note">Ресми бетті ашыңыз, баптың мәтінін материалмен салыстырыңыз. Редакция күнін, тексеру күнін және қорытындыны енгізіңіз. Өзгерістер тарихы сақталады. Бұл белгілеу жүйесі заң сайттарын автоматты бақыламайды.</p><div class="flowline"><span>01 · Тексеру қажет</span><span>02 · Ресми баппен салыстыру</span><span>03 · Тексерілген / Жаңарту қажет</span></div></div>${tabs()}${filters(true)}<div class="section-top"><h2>Контент тізімі</h2><span class="small-note">${items.length} материал</span></div><div class="table-wrap"><table><thead><tr><th>Материал</th><th>Бап / сынып</th><th>Мәртебе</th><th>Әрекет</th></tr></thead><tbody>${items.slice(0,120).map(x=>`<tr><td class="title"><strong>${esc(x.title)}</strong><small>${x.kind==='question'?'Тест':x.kind==='case'?'Жағдаят':'Параграф'} · ${esc(x.category)}</small></td><td>${esc(x.article)||'—'}<small>${x.grade||9}-сынып</small></td><td>${tag(x)}<small>${x.checkedAt?date(x.checkedAt):'Салыстырылмаған'}</small></td><td><div class="actions">${btn('Өңдеу','edit',`data-id="${x.id}"`,'small')}${btn('Тарих','audit',`data-id="${x.id}"`,'small')}</div></td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div class="section-top"><h2>Оқушылардың ілгерілеуі</h2>${btn('Жаңарту','classroom','','small')}</div><div id="classroom">${classroomHTML()}</div>`}
function classroomHTML(){if(!classroom)return '<p class="small-note">Нәтижелер жүктелуде…</p>';if(!classroom.length)return '<div class="card"><p class="small-note">Оқушы осы сайтта жаттығу орындағаннан кейін нәтижесі осында көрінеді. Қазіргі Sites нұсқасы бастапқыда тек өзіңізге ашық; оқушыларға қолжетімділік Sites бөлісу баптауынан беріледі.</p></div>';const map=new Map();for(const r of classroom){if(!map.has(r.user))map.set(r.user,{name:r.name,done:0,total:0,score:0,last:r.date,wrong:new Set()});const a=map.get(r.user);if(r.complete){a.done++;a.total+=r.total;a.score+=r.score}for(const ans of r.answers||[])if(!a.wrong.has(ans.id))a.wrong.add(ans.id+':'+ans.correct)}return `<div class="table-wrap"><table><thead><tr><th>Оқушы</th><th>Аяқталған</th><th>Дұрыс жауап</th><th>Соңғы белсенділік</th><th>Талдау</th></tr></thead><tbody>${[...map].map(([id,x])=>`<tr><td>${esc(x.name)}</td><td>${x.done}</td><td>${x.total?Math.round(x.score/x.total*100)+'%':'—'}</td><td>${date(x.last)}</td><td>${btn('Жауаптар','student-read',`data-id="${esc(id)}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`}
async function loadClassroom(){try{classroom=await api('classroom');if($('#classroom'))$('#classroom').innerHTML=classroomHTML()}catch(e){notice(e.message)}}
function archivePage(){return head('Бұрынғы материалдар сақталды','Қолжетімді бастапқы файлдар өзгеріссіз жеке мұрағатқа енгізілді.')+`<div class="banner">GitHub-тағы қазіргі жарияланымға тікелей қолжетімділік болмады. Бұл нұсқада сақталған файлдар қамтылды; қазіргі GitHub-та бұдан кейін қосылған материал болса, оны бөлек импорттау қажет.</div><div class="itemgrid">${[['collections-original.html','Толық сыныптық жинақтар','9–11-сынып тесттері, нұсқалар, оқулық тапсырмалары мен жағдаяттар.'],['animated-original.html','Animated Premium нұсқасы','Кейін сақталған дизайн мен оқу материалдары.'],['premium-original.html','Premium Legal дизайн үлгісі','Таңдалған визуалды бағыттың бастапқы үлгісі.']].map(([f,t,d])=>`<div class="card"><div class="lesson-icon">${I('folder')}</div><h3>${t}</h3><p class="small-note">${d}</p><a class="btn small" href="/archive/${f}" target="_blank" rel="noopener">Бастапқы нұсқаны ашу ↗</a></div>`).join('')}</div><div class="card"><h3>Бұрынғы нәтиже мен жинақтарды көшіру</h3><p class="small-note">GitHub пен Sites мекенжайларының браузер жады бөлек. Ескі сайттың браузердегі нәтижелері автоматты көшпейді. Ескі нұсқадан жүктелген JSON сақтық көшірмесін импорттаңыз. JSON-дағы бастапқы ақпарат толық сақталады; осы қолданбаның жинақтары бар болса, біріктіріледі.</p>${btn('Импорт және экспорт','nav','data-view="sources"','primary small')}</div>`}
function sourcesPage(){return head('Дерекке сүйенген дайындық','Құқықтық негіз, тексеру шекарасы және деректердің сақтық көшірмесі.')+`<div class="card source-list"><span class="tag verified">2026 жылғы 10 қарашада салыстырылды</span><h2>Қазақстан Республикасының Конституциясы</h2><p>2026 жылғы 1 шілдеден күшіне енуі — 94-бап. Жаңа оқу материалдары 1, 2, 4, 5, 16, 19, 52 және 94-баптарға сүйенеді. Барлық бұрынғы контент толық тексерілген деп белгіленбейді.</p><p><a href="https://www.akorda.kz/public/kz/kazakstan-respublikasynyn-konstituciyasy-3053334" target="_blank" rel="noopener">Ақорда — ресми қазақша мәтін ↗</a></p><p><a href="https://old.adilet.zan.kz/kaz/docs/K2600000000" target="_blank" rel="noopener">Әділет — Конституция және құжат деректемелері ↗</a></p><p class="small-note">Оқу түсіндірмелері — норманың ықшам мазмұны. Қолданылатын нақты редакцияны ресми құжаттан тексеріңіз. Азаматтық, еңбек және өзге салалардағы бұрынғы сұрақтар мұғалімнің салыстыру кезегінде сақталған.</p></div><div class="card"><h2>Сақтық көшірме</h2><p class="small-note">Экспортта жеке жинақтар, әр жауап, нәтижелер және импорт мұрағаты сақталады. Импорт ешбір бар материалды өшірмейді: файл толық мұрағатталады, жеке жинақтар біріктіріледі.</p><div class="actions">${btn('JSON көшірмені жүктеу '+I('download'),'export','','primary')}<label class="btn" for="import-file">JSON файлды импорттау</label><input type="file" id="import-file" accept=".json,application/json" class="hidden"></div><p class="small-note">Импортталған файл саны: ${(state.personal.legacyBackup||[]).length}. Бұрынғы нәтижелер импорт мұрағатында бастапқы пішімімен сақталады.</p>${(state.personal.legacyBackup||[]).map((x,i)=>`<div class="actions"><span class="small-note">${i+1}-файл · ${date(x.date)}</span>${btn('Түпнұсқаны жүктеу','legacy-download',`data-index="${i}"`,'small')}</div>`).join('')}</div>`}
function sourceLink(url,article){if(!url)return '<span class="small-note">Ресми дереккөз әлі тіркелмеген.</span>';return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Ресми дереккөз${article?' · '+esc(article)+'-бап':''} ↗</a>`}
function openDialog(title,body){$('#editor').innerHTML=`<div class="dialog-top"><h2>${title}</h2><button class="close" data-action="close" aria-label="Жабу">${I('close')}</button></div><div class="dialog-body">${body}</div>`;if(!$('#editor').open)$('#editor').showModal()}
function readItem(id){const x=byId(id);if(!x)return;if(x.kind==='question'){openDialog('Тест сұрағы',`<div class="tags">${tag(x)}<span class="tag">${esc(x.category)}</span></div><h3>${esc(x.title)}</h3>${x.options.map((o,i)=>`<p class="small-note">${String.fromCharCode(65+i)}. ${esc(o)}</p>`).join('')}${x.status==='verified'?btn('Осы сұрақпен жаттығу','single-start',`data-id="${x.id}"`,'primary'):'<div class="banner">Ресми нормамен салыстыру күтілуде. Мұғалім тексергеннен кейін жаттығуға қосылады.</div>'}${state.me.role==='teacher'?`<details><summary>Мұғалімге: жауап пен түсіндірме</summary><p>Дұрыс: ${String.fromCharCode(65+x.answer)}. ${esc(x.explanation)}</p></details>`:''}<div class="divider"></div>${sourceLink(x.sourceUrl,x.article)}`);return}const saved=state.personal.caseAnswers?.[id]||'';openDialog(x.kind==='case'?'Құқықтық жағдаят':'Параграф',`<div class="tags">${tag(x)}<span class="tag">${esc(x.category)}</span></div><h3>${esc(x.title)}</h3><div class="review-text">${esc(x.body)}</div>${x.kind==='case'?`<div class="divider"></div><form class="case-form" id="case-form" data-id="${id}"><label for="case-answer">Қолданылатын норма → Дәлел → Қорытынды</label><textarea id="case-answer" name="answer" maxlength="12000" placeholder="Бапты атаңыз, деректерге сүйеніп қорытынды жасаңыз…">${esc(saved)}</textarea><button class="btn primary">Талдауымды сақтау</button><p class="small-note">Бұл ашық жауап. Автоматты ұпай қойылмайды.</p></form><details><summary>Үлгі талдауды көрсету</summary><p>${esc(x.explanation)}</p></details>`:''}<div class="divider"></div><div class="small-note">Бап: ${esc(x.article)||'нақтыланбаған'} · Редакция: ${x.effective?date(x.effective):'нақтыланбаған'} · Тексеру: ${x.checkedAt?date(x.checkedAt):'күтілуде'}</div><p>${sourceLink(x.sourceUrl,x.article)}</p><p class="small-note">${esc(x.note)}</p>${btn('Жинаққа қосу '+I('save'),'bookmark',`data-id="${x.id}"`,'small')}`)}
function editor(id){const x=byId(id)||{id:'',kind:'paragraph',title:'',body:'',category:'Конституциялық құқық',grade:9,article:'',sourceUrl:'',effective:'',checkedAt:'',status:'pending',note:'',options:['','','',''],answer:0,explanation:'',revision:0};
const field=(name,label,type='text',max=2000)=>`<div class="field"><label for="e-${name}">${label}</label><input type="${type}" id="e-${name}" name="${name}" value="${esc(x[name])}" maxlength="${max}" ${['title','category'].includes(name)?'required':''}></div>`;
openDialog(id?'Материалды өңдеу':'Жаңа материал',`<form id="content-form" data-id="${x.id}" data-revision="${x.revision}"><div class="form-grid"><div class="field"><label for="e-kind">Материал түрі</label><select id="e-kind" name="kind">${[['paragraph','Параграф'],['question','Тест сұрағы'],['case','Құқықтық жағдаят']].map(([v,t])=>`<option value="${v}" ${x.kind===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="e-grade">Сынып</label><select name="grade" id="e-grade">${[9,10,11].map(v=>`<option ${v===x.grade?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label for="e-title">Атауы / сұрақ мәтіні</label><textarea id="e-title" name="title" maxlength="1200" required>${esc(x.title)}</textarea></div>${field('category','Санат / құқық саласы')} ${field('article','Бап және тармақ','text',40)}<div class="field full" id="body-field"><label for="e-body">Параграф немесе жағдаят мәтіні</label><textarea id="e-body" name="body" maxlength="20000">${esc(x.body)}</textarea></div><div class="field full ${x.kind==='question'?'':'hidden'}" id="question-fields"><div class="form-grid">${[0,1,2,3].map(i=>`<div class="field"><label for="e-option${i}">${String.fromCharCode(65+i)} нұсқасы</label><input name="option${i}" id="e-option${i}" value="${esc(x.options?.[i]||'')}" maxlength="1000"></div>`).join('')}<div class="field"><label for="e-answer">Дұрыс жауап</label><select name="answer" id="e-answer">${[0,1,2,3].map(i=>`<option value="${i}" ${i===x.answer?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}</select></div></div></div><div class="field full"><label for="e-explanation">Жауап түсіндірмесі / үлгі талдау</label><textarea id="e-explanation" name="explanation" maxlength="12000">${esc(x.explanation)}</textarea></div>${field('sourceUrl','Ресми дереккөз сілтемесі','url')}<div class="field"><label for="e-status">Тексеру мәртебесі</label><select name="status" id="e-status">${Object.entries(statusNames).map(([v,t])=>`<option value="${v}" ${x.status===v?'selected':''}>${t}</option>`).join('')}</select></div>${field('effective','Норманың редакция / қолданылу күні','date')}${field('checkedAt','Салыстырылған күн','date')}<div class="field full"><label for="e-note">Салыстыру қорытындысы / өзгерту себебі</label><textarea id="e-note" name="note" maxlength="2000" placeholder="Ресми баппен не салыстырылды? Қай тұсы өзгерді?">${esc(x.note)}</textarea></div></div><p class="small-note">«Тексерілген» мәртебесіне ресми сілтеме, бап, екі күн және қорытынды міндетті. Ескі мәтін өзгерістер тарихында қалады.</p><div id="form-error" class="error-text" role="alert"></div><div class="dialog-actions">${btn('Болдырмау','close')}<button class="btn primary" type="submit">Сақтау ${I('check')}</button></div></form>`);
}
async function startQuiz(data={}){const s=await api('start',data);session=s;pos=0;feedback=null;lastSummary=null;$('#editor').close();nav('practice')}
async function resume(id){const s=await api('resume',{id});session=s;pos=s.answers.length;feedback=null;if(pos===s.questions.length){lastSummary=state.attempts.find(a=>a.id===id)}nav('practice')}
async function savePersonal(key,value){await api('personal',{key,value});state.personal[key]=value}
function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(busy)return;
try{if(a==='report'){downloadReport();return}if(a==='nav'){nav(b.dataset.view);return}if(a==='menu'){$('.sidebar').classList.toggle('open');return}if(a==='close'){$('#editor').close();return}if(a==='read'){readItem(id);return}if(a==='create'){editor();return}if(a==='edit'){editor(id);return}if(a==='kind'){kind=b.dataset.kind;render();return}if(a==='filter'){query=$('#filter-query').value;category=$('#filter-category').value;grade=$('#filter-grade').value;status=$('#filter-status').value;render();return}
busy=true;b.disabled=true;
if(a==='start')await startQuiz();if(a==='single-start')await startQuiz({ids:[id]});if(a==='resume')await resume(id);
if(a==='answer'){const r=await api('answer',{id:session.id,index:pos,answer:Number(b.dataset.answer)});feedback=r.result;lastSummary=r.summary;session.answers[pos]=feedback;await reload();render()}
if(a==='next'){pos++;feedback=null;render()}
if(a==='pause'){session=null;feedback=null;await reload();nav('practice')}
if(a==='quiz-close'){session=null;await reload();nav('progress')}
if(a==='mistake-start')await startQuiz({ids:wrongIds(),limit:50});
if(a==='collection-start'){const c=state.personal.collections.find(x=>x.id===id);await startQuiz({ids:c.ids,limit:50})}
if(a==='bookmark'){const list=state.personal.collections||[];openDialog('Жеке жинаққа қосу',`<form id="bookmark-form" data-id="${id}"><div class="field"><label for="bookmark-target">Жинақты таңдаңыз</label><select name="collection" id="bookmark-target">${list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="new">Жаңа: Таңдаулылар</option></select></div><div class="dialog-actions"><button class="btn primary">Жинаққа қосу</button></div></form>`)}
if(a==='collection-open'){const c=state.personal.collections.find(x=>x.id===id);openDialog(esc(c.name),c.ids.length?c.ids.map(qid=>{const q=byId(qid);return q?`<div class="card"><h3>${esc(q.title)}</h3><div class="actions">${btn('Ашу','read',`data-id="${q.id}"`,'small')}${btn('Жинақтан алу','collection-remove',`data-id="${c.id}" data-item="${q.id}"`,'small')}</div></div>`:''}).join(''):'<p class="small-note">Жинақ бос. Кітапханадан материал қосыңыз.</p>')}
if(a==='collection-remove'){const list=structuredClone(state.personal.collections);list.find(c=>c.id===id).ids=list.find(c=>c.id===id).ids.filter(x=>x!==b.dataset.item);await savePersonal('collections',list);$('#editor').close();render();notice('Материал жинақтан алынды. Кітапханада сақталды.')}
if(a==='attempt-read'){const r=state.attempts.find(x=>x.id===id);openDialog('Жауаптарды талдау',`<p>${r.score} / ${r.total} · ${r.pct}% · ${date(r.date)}</p>`+(r.answers||[]).map(x=>`<details><summary>${x.correct?'✓':'×'} ${esc(x.title)}</summary><p>Сіздің жауабыңыз: ${String.fromCharCode(65+x.selected)}. Дұрыс жауап: ${String.fromCharCode(65+x.answer)}.</p><p>${esc(x.explanation)}</p>${sourceLink(x.sourceUrl,x.article)}</details>`).join(''))}
if(a==='audit'){const rows=await api('audit?id='+encodeURIComponent(id));openDialog('Өзгерістер тарихы',rows.length?rows.map(x=>{const d=JSON.parse(x.current);return `<div class="audit"><strong>${date(x.created_at)} · ${esc(statusNames[d.status])}</strong><p>${esc(d.note||'Жазба жоқ')}</p><small>${esc(d.sourceUrl)}</small><details><summary>Алдыңғы және жаңа нұсқа</summary><pre class="audit-pre">${esc(JSON.stringify({previous:x.previous?JSON.parse(x.previous):null,current:d},null,2))}</pre></details></div>`}).join(''):'<p class="small-note">Бұл материал әлі өңделмеген. Бастапқы нұсқасы сақталған.</p>')}
if(a==='classroom')await loadClassroom();
if(a==='student-read'){const rows=classroom.filter(x=>x.user===id);openDialog('Оқушы жауаптары',rows.map(r=>`<details><summary>${date(r.date)} · ${r.score} / ${r.total} · ${r.complete?'Аяқталған':'Жалғасуда'}</summary>${r.answers.map(x=>`<p>${x.correct?'✓':'×'} ${esc(x.title)}<br>Таңдалған: ${String.fromCharCode(65+x.selected)} · Дұрыс: ${String.fromCharCode(65+x.answer)}</p>`).join('')}</details>`).join(''))}
if(a==='export'){download(await api('export'),'QUQYQ_OLYMP_AI_backup_'+new Date().toISOString().slice(0,10)+'.json');notice('Сақтық көшірме жүктелді.')}
if(a==='legacy-download')download(state.personal.legacyBackup[Number(b.dataset.index)].file,'QUQYQ_import_'+(Number(b.dataset.index)+1)+'.json');
}catch(e){notice(e.message)}finally{busy=false;b.disabled=false}});
document.addEventListener('change',ev=>{if(ev.target.id==='mode'){mode=ev.target.value;try{localStorage.setItem('quqyq-view-mode',mode)}catch{}nav(mode==='teacher'?'teacher':'home')}if(ev.target.id==='e-kind'){$('#question-fields').classList.toggle('hidden',ev.target.value!=='question');$('#body-field').classList.toggle('hidden',ev.target.value==='question')}if(ev.target.id==='import-file')importFile(ev.target.files[0])});
async function importFile(file){if(!file)return;try{if(file.size>1400000)throw new Error('JSON файл 1,4 МБ-тан аспауы керек.');const b=JSON.parse(await file.text()),r=await api('import',b);await reload();render();notice(r.message)}catch(e){notice(e.message)}}
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target;if(f.id==='global-search'){query=new FormData(f).get('query');kind='all';status='';category='';grade='';nav('library');return}if(busy)return;const data=new FormData(f),button=f.querySelector('[type="submit"]')||f.querySelector('button');try{busy=true;if(button)button.disabled=true;
if(f.id==='practice-form')await startQuiz(Object.fromEntries(data));
if(f.id==='content-form'){const item=Object.fromEntries(data);item.id=f.dataset.id;item.grade=Number(item.grade);item.answer=Number(item.answer);item.options=[0,1,2,3].map(i=>item['option'+i]);await api('content',{item,revision:Number(f.dataset.revision)});await reload();$('#editor').close();render();notice('Материал сақталды. Өзгерістер тарихы тіркелді.')}
if(f.id==='new-collection'){const list=structuredClone(state.personal.collections||[]);list.push({id:crypto.randomUUID(),name:String(data.get('name')).trim(),ids:[]});await savePersonal('collections',list);render();notice('Жаңа жинақ жасалды.')}
if(f.id==='bookmark-form'){const list=structuredClone(state.personal.collections||[]);let target=list.find(x=>x.id===data.get('collection'));if(!target){target={id:crypto.randomUUID(),name:'Таңдаулылар',ids:[]};list.push(target)}if(!target.ids.includes(f.dataset.id))target.ids.push(f.dataset.id);await savePersonal('collections',list);$('#editor').close();render();notice('Материал жеке жинаққа қосылды.')}
if(f.id==='case-form'){const all={...(state.personal.caseAnswers||{}),[f.dataset.id]:String(data.get('answer'))};await savePersonal('caseAnswers',all);notice('Талдауыңыз осы браузерде сақталды.')}
}catch(e){if($('#form-error'))$('#form-error').textContent=e.message;else notice(e.message)}finally{busy=false;if(button)button.disabled=false}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='filter-query'){e.preventDefault();document.querySelector('[data-action="filter"]').click()}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(state&&next!==view)nav(next)});
reload().then(()=>{render();if(view==='teacher')loadClassroom()}).catch(e=>{$('#app').innerHTML=`<main class="loading"><div class="card auth-card"><div class="seal">⚖</div><h1>QŪQYQ OLYMP AI</h1><p>${esc(e.message)}</p><p class="small-note">Бұл нұсқа тіркелуді қажет етпейді. Сақтау қатесі болса, браузердің жеке режимін өшіріп, бетті жаңартыңыз. Деректерді бірден өшірмеңіз.</p></div></main>`});


document.addEventListener('click',e=>{const link=e.target.closest('a[href^="/archive/"]');if(!link)return;e.preventDefault();const name=link.getAttribute('href').slice(9),content=ORIGINAL_ARCHIVES[name];if(!content)return;const url=URL.createObjectURL(new Blob([content],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Бастапқы материал HTML файлы ретінде жүктелді.');});
function downloadReport(){
 const a=state.attempts.find(x=>x.complete);if(!a){notice('Есеп үшін алдымен бір жаттығуды аяқтаңыз.');return}
 const stamp=new Date(a.date).toLocaleString('kk-KZ');
 const parts=['QŪQYQ OLYMP AI — ОҚУШЫ НӘТИЖЕСІ','Оқушының аты-жөні: ____________________','Күні: '+stamp,'Нәтиже: '+a.score+' / '+a.total+' ('+a.pct+'%)',''];
 for(const [i,x]of a.answers.entries()){parts.push((i+1)+'. '+x.title,'Сіздің жауабыңыз: '+String.fromCharCode(65+x.selected),'Дұрыс жауап: '+String.fromCharCode(65+x.answer),(x.correct?'Дұрыс. ':'Қате. ')+x.explanation,'Бап: '+x.article,'Дереккөз: '+x.sourceUrl,'')}
 const blob=new Blob(['\uFEFF'+parts.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='QUQYQ_natizhe_'+new Date(a.date).toISOString().slice(0,10)+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Оқуға ыңғайлы есеп жүктелді. Мұғалімге осы файлды жіберуге болады.');
}
</script></body></html>
